# 2007–2011 Toyota Tundra. The 2007–2011 Camry remote needs a tool, so this truck is the on-board fallback.
make: Toyota
makeSlug: toyota
model: Tundra
modelSlug: tundra
yearStart: 2007
yearEnd: 2011
yearSlug: "2007-2011"
market: US
title: "2007-2011 Toyota Tundra keyless remote programming"
description: "On-board steps for a 2007-2011 Toyota Tundra keyless remote, FCC
  ID GQ43VT20T, seller part numbers, the CR2032 battery, and USD prices."
summary: "Toyota service pages opened for 2007, 2009, 2011, 2012, and 2013
  Tundras publish a switch sequence for the keyless remote. Sellers of the
  matching aftermarket and used remotes say a locksmith has to program them.
  It is not confirmed that those remotes accept the switch sequence."
scope: "This page is the 2007-2011 Toyota Tundra with a metal ignition key and
  a separate keyless remote. Sellers list the same FCC ID through 2018. The
  switch section was opened for a 2007 4.7L 4WD, a 2009 4.7L 4WD, a 2011 5.7L
  4WD, a 2012 Limited 5.7L 4WD, and a 2013 SR5 4.6L RWD. Those 2012 and 2013
  pages still print the same switch sequence. 2014 and later were not opened.
  A push-button smart key has no ignition cylinder for this sequence, and this
  page does not apply to it. The sequence registers the remote only."
reviewed: "2026-11-19"
diy:
  status: "yes"
  heroAnswer: "Yes, per Toyota service pages; some sellers say a locksmith is needed"
  heroNotice: "Push-button smart key, or no ignition key cylinder? This page does not apply. Sellers list this remote for 2007-2018. The same on-board switch section was opened on 2012 and 2013 service pages. 2014 and later were not opened."
  priceCaution: "Car and Truck Remotes says on-board programming is no. NorthCoast Keyless says a locksmith must program the remote. Toyota service pages for 2007, 2009, 2011, 2012, and 2013 publish an on-board switch sequence. Not confirmed that these aftermarket or lightly used remotes accept that sequence. On a Toyota Tundra Forum thread about a 2009, one owner reported the door sequence failed after many tries and that Techstream then registered the fobs. No report on that thread confirmed an aftermarket GQ43VT20T registering with the switch sequence alone."
  priceCautionSourceIds:
    - ctr-gq43
    - nck-gq43
    - tundra-2007
    - tundra-2012
    - tundra-2013
    - tundra-forum-2009
  summary: "The opened Tundra service pages give a switch sequence that registers
    the door-lock remote without a scan tool. Add mode keeps remotes already
    stored, until the truck is holding four. Rewrite mode erases the stored
    remotes and keeps only the ones you register in that session."
  condition: "You need the ignition key that fits the cylinder, and every remote
    you want the truck to keep. The remote price below is the remote only."
  safetyNote: "Rewrite mode erases remotes the truck already knows. A missed
    time limit can leave you out of registration mode, and a locksmith or dealer
    then has to finish the job. If the doors do not answer the mode you chose,
    stop. Do not keep cycling the ignition."
  sourceIds:
    - tundra-2007
    - tundra-2009
    - tundra-2011
  notes:
    - text: "Add mode keeps codes already stored. If a fifth code is added, the
        pages say the oldest stored code is erased. Rewrite mode clears every
        stored code first. The truck can hold four recognition codes."
      sourceIds:
        - tundra-2007
        - tundra-2009
        - tundra-2011
    - text: "The same pages also describe registration with an Intelligent Tester
        or Techstream. That path is a shop tool. No dealer dollar amount for it
        was found."
      sourceIds:
        - tundra-2007
        - tundra-2011
    - text: "Car and Truck Remotes prints 'On Board Programming: No.' NorthCoast
        Keyless says a locksmith must program the remote. Those lines disagree
        with the switch section on the Toyota pages. It is not confirmed that
        the aftermarket or lightly used remotes accept that sequence."
      sourceIds:
        - ctr-gq43
        - nck-gq43
        - tundra-2007
        - tundra-2012
        - tundra-2013
        - tundra-forum-2009
  steps:
    - text: "Start with the key out of the ignition, the driver door open and
        unlocked, and every other door closed."
      sourceIds:
        - tundra-2007
    - text: "Within 5 seconds, insert the key and remove it, then insert it and
        remove it again. End with the key out."
      sourceIds:
        - tundra-2007
    - text: "Within 40 seconds, close and open the driver door twice. End with
        that door open."
      sourceIds:
        - tundra-2007
    - text: "Still inside those 40 seconds, insert the key and remove it. End
        with the key out."
      sourceIds:
        - tundra-2007
    - text: "Close and open the driver door twice again. End with that door open."
      sourceIds:
        - tundra-2007
    - text: "Insert the key and close all the doors."
      sourceIds:
        - tundra-2007
    - text: "Within 40 seconds, turn the ignition from ON to OFF about once per
        second. Once chooses add mode. Twice chooses rewrite mode. Three times
        chooses confirmation. Five times chooses prohibition. Zero, four, or six
        or more gets no lock response."
      sourceIds:
        - tundra-2007
    - text: "Remove the key. Within 5 seconds the locks answer. Add mode cycles
        once. Rewrite mode cycles twice. Confirmation cycles once for each stored
        remote, or five times if none are stored. Confirmation and prohibition
        end after that answer."
      sourceIds:
        - tundra-2007
    - text: "For add or rewrite, the switch-operation section says to press a
        single switch (Lock or Unlock) within 5 seconds. One lock-unlock cycle
        means that remote was stored. Two cycles means it failed, and the pages
        say to start over."
      sourceIds:
        - tundra-2007
    - text: "The Techstream section on those same pages says to press Lock and
        Unlock together for 1 to 1.5 seconds, then press either switch. A Tundra
        forum write-up uses that two-button hold as well. Those are a second
        version of the button press, not the switch-operation wording."
      sourceIds:
        - tundra-2007
        - tundra-forum-2009
    - text: "Repeat that Lock or Unlock press for each remote you want to keep,
        up to four in the same session."
      sourceIds:
        - tundra-2007
    - text: "Open a door, or put the key back in the cylinder, to leave
        registration. Then test lock, unlock, and panic."
      sourceIds:
        - tundra-2007
variants:
  - id: gq43vt20t-3-button
    name: "3-button keyless remote"
    years: "Listed by sellers for 2007-2011 Tundra, and for later years this page does not cover"
    keyType: separate-remote
    keyTypeNote: "Car and Truck Remotes and NorthCoast Keyless both sell a separate
      3-button remote, Lock, Unlock, and Panic, for a turn-the-key Tundra. It is
      not a remote-head key and not a push-button smart key. The service pages
      call the part a door control transmitter."
    keyTypeSourceIds:
      - ctr-gq43
      - nck-gq43
      - tundra-2007
    fccIds:
      - id: GQ43VT20T
        role: oem
        note: "FCC grant to TRW Inc. for an automotive remote control. The grant
          reproduced by FCCID.io lists 315.0 MHz under rule 15.231. Original
          grant date September 30, 2002. Later class II grants are dated June 1,
          2010 and August 24, 2012. Both sellers print this ID on the Tundra remote."
        sourceIds:
          - fcc-gq43
          - ctr-gq43
          - nck-gq43
    oemPartNumbers:
      - number: "89742-AE010"
        summary: true
        note: "Printed by Car and Truck Remotes and by NorthCoast Keyless as a
          Toyota part this remote replaces. The listings also name later Tundra
          years. Not confirmed on a Toyota parts fiche for 2007-2011 only."
        sourceIds:
          - ctr-gq43
          - nck-gq43
      - number: "89742-AE011"
        note: "Printed beside 89742-AE010 on the same two listings. The sellers do
          not say which of the two numbers is the 2007-2011 part."
        sourceIds:
          - ctr-gq43
          - nck-gq43
    battery:
      status: verified
      type: CR2032
      note: "NorthCoast Keyless lists CR2032 as the compatible battery. Car and
        Truck Remotes also prints CR2032. The FCC grant page does not name the cell."
      sourceIds:
        - nck-gq43
        - ctr-gq43
    frequency:
      status: verified
      text: "315 MHz"
      note: "The grant lists 315.0–315.0 MHz. Both sellers also print 315 MHz."
      sourceIds:
        - fcc-gq43
        - ctr-gq43
        - nck-gq43
    buttons:
      count: 3
      sourceIds:
        - ctr-gq43
        - nck-gq43
    sellerClaims:
      - text: "Car and Truck Remotes says on-board programming is no, and that a
          locksmith must program the remote. The service pages opened for this
          truck print a switch sequence that does not use a scan tool."
        sourceIds:
          - ctr-gq43
          - tundra-2007
