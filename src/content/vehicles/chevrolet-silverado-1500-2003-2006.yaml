troubleshooting:
  - id: no-cycle
    title: The locks do not cycle at all
    text: North Coast Keyless's 2005 Silverado programming page says that if the
      locks never cycle, you may be turning the key too quickly or too slowly,
      the keyless-entry system may have a problem, or the truck may not have
      keyless entry. It says to check with a locksmith or a dealer. The opened
      GM service pages say the locks should cycle when you release the unlock
      switch. They do not print this split.
    sourceIds:
      - nck-2005-steps
      - gm-2005-hybrid
      - gm-2007-classic
  - id: early-cycle
    title: The locks cycle before you release the unlock switch
    text: The same North Coast page says a cycle before you release the unlock
      button means the truck has not entered programming mode, and you start
      over. If the locks keep cycling before you release the button, that page
      says the keyless-entry system has a problem and a locksmith or dealer has
      to program the remotes. The opened GM service pages do not print that
      early-cycle test.
    sourceIds:
      - nck-2005-steps
  - id: no-response
    title: No second response from the remote
    text: North Coast says to hold Lock and Unlock together for up to 30 seconds,
      until the locks cycle again. The opened GM service pages say that
      confirmation comes after about 15 seconds. Neither page gives a separate
      test for a remote that stays silent after the locks have already cycled to
      confirm program mode. That case is unknown here.
    sourceIds:
      - nck-2005-steps
      - gm-2005-hybrid
      - gm-2007-classic
