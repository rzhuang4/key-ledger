      plus bas.
    scope: Pick-up Ford F-150 2011-2014 avec émetteur de tête intégrée et panneton,
      souvent vendus comme clé à télécommande 3 boutons et ID FCC CWTWB1U793.
      Les durées ci-dessous viennent d’une transcription du guide 2013, pas des
      livres 2011, 2012 ou 2014. Les clés Intelligent Access à bouton ne sont
      pas couvertes.
    diy:
      summary: Une programmation à bord est publiée pour un émetteur de tête intégrée
        quand deux clés codées marchent déjà. Sans ces deux-là, la transcription
        de 2013 et la page Ford vous envoient chez le concessionnaire.
      condition: Il faut deux clés codées déjà programmées et un émetteur de tête
        intégrée ou une clé SecuriLock neufs, non programmés. Le panneton doit
        quand même être taillé. Car and Truck Remotes dit ne pas tailler ni
        programmer la télécommande vendue.
      safetyNote: Les durées d’appui des sources de cette page ne concordent pas. Une
        mauvaise séquence peut laisser la nouvelle clé non programmée. Sans deux
        clés qui marchent, la méthode à bord ne s’applique pas et il faut un
        concessionnaire ou un serrurier. Si un essai prudent échoue, arrêtez et
        laissez un serrurier ou le concessionnaire finir.
      notes:
        - text: La transcription de 2013 dit que la procédure programme le code
            d’antidémarrage et les boutons de la télécommande, et qu’elle ne
            vaut que pour des émetteurs de tête intégrée ou des clés SecuriLock
            ordinaires. Huit clés codées au plus, et seulement quatre de ces
            huit peuvent être des émetteurs de tête intégrée.
        - text: "La fiche Car and Truck Remotes du F-150 2013 dit « On Board Programming:
            No » et qu’un serrurier doit tailler et programmer la télécommande.
            Cela contredit la transcription du guide et la page Ford. Le vendeur
            dit aussi qu’un concessionnaire peut refuser de programmer une
            télécommande d’après-vente."
      steps:
        - text: Gardez à portée deux clés codées déjà programmées et la nouvelle clé non
            programmée. Lisez toute la séquence avant de commencer. Le texte
            suit l’Owner's Guide du F-150 2013, 1er tirage, transcrit par Auto
            Guide Galaxy. Ce site n’a pas ouvert le PDF original de Ford.
        - text: Insérez la première clé programmée. Tournez le contact de off à on et
            laissez-le au moins 3 secondes et pas plus de 10. Remettez sur off
            et retirez la clé.
        - text: Après 3 secondes, mais dans les 10 secondes après avoir retiré la première
            clé, insérez la deuxième clé programmée. Contact sur on au moins 1
            seconde et pas plus de 10. Remettez sur off et retirez-la.
        - text: Après 3 secondes, mais dans les 10 secondes après avoir retiré la deuxième
            clé, insérez la nouvelle clé non programmée. Contact sur on au moins
            1 seconde et pas plus de 10, puis retirez-la.
        - text: Si cela a marché, la nouvelle clé démarre le moteur. Si c’est un émetteur
            de tête intégrée, elle commande aussi l’ouverture à distance. En cas
            d’échec, la transcription dit d’attendre 20 secondes et de répéter,
            puis d’emmener le pick-up chez un concessionnaire agréé.
    comparisons:
      caption: Ne mélangez pas ces durées dans un même essai. La colonne de gauche est
        la transcription du manuel 2013. Celle de droite est le guide général
        actuel de Ford, qui ne nomme pas le F-150.
      columns:
        - heading: Transcription du guide 2013
        - heading: Guide Ford.com (sans année-modèle)
      rows:
        - action: Première clé programmée sur on
