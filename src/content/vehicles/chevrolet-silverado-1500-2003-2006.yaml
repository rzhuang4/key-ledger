    troubleshooting:
      - id: no-cycle
        title: ロックがまったく動かない
        text: North Coast Keyless の 2005 Silverado
          のページは、ロックがまったく動かない場合、キーを回すのが速すぎるか遅すぎるか、キーレスに不具合があるか、キーレス非装着かもしれないと書いています。鍵屋かディーラーに確認するよう書いています。開いた
          GM の修理ページは、アンロックを放したときにロックが動くはずだとだけ書いていて、この分け方は載っていません。
      - id: early-cycle
        title: アンロックを放す前にロックが動く
        text: 同じ North Coast
          のページは、アンロックを放す前に動いたらプログラミングモードに入っていないので最初からやり直す、と書いています。放す前に動き続けるなら、キーレスに不具合があり、鍵屋かディーラーが登録する必要があるとも書いています。開いた
          GM の修理ページに、この早すぎる動作のテストはありません。
      - id: no-response
        title: リモコンから 2 回目の応答がない
        text: North Coast は Lock と Unlock を最大 30 秒、ロックが再び動くまで押すと書いています。開いた GM
          の修理ページは、その確認がおよそ 15
          秒後だと書いています。どちらも、プログラミングモード確認のあとリモコンが無反応のままの場合の別テストは書いていません。その場合はここでは不明です。
  ko:
    title: 2003-2006 Chevrolet Silverado 1500 키 포브 프로그래밍
    description: 2003-2006 Silverado 1500 키리스 리모컨의 차 안 절차. FCC ID LHJ011, 부품 번호,
      배터리, 출처 있는 가격.
    summary: 2003-2006 Chevrolet Silverado 1500 키리스 리모컨은 진단기 없이 점화 스위치에서 프로그래밍할 수
      있습니다. 부품 21997127 설명서가 이 트럭을 적고 버튼 순서를 실었습니다. 리모컨은 분리형이며 금속 점화 키가 아닙니다.
    scope: 라이트 듀티 Silverado 1500, 2003년부터 2006년, 미국 시장입니다. 같은 설명서는 2007 Silverado
      1500과 여러 HD도 적습니다. 그 차들은 이 페이지 밖입니다. 공장에서 키리스가 없는 트럭에는 이 리모컨이 말할 수신기가
      없습니다.
    diy:
      summary: 남길 리모컨은 모두 같은 차례에 프로그래밍합니다. 설명서는 첫 새 송신기가 받아들여지면 이전에 저장된 송신기가 지워진다고
        합니다. 이 순서는 키리스 리모컨만 프로그래밍합니다.
      condition: 호환 리모컨과 자물쇠 실린더를 돌리는 점화 키가 필요합니다. 금속 키를 깎지는 않습니다.
      safetyNote: 설명서는 이번 차례에서 처음 받아들여진 리모컨이 트럭이 이미 아는 리모컨을 지운다고 합니다. 순서를 잘못하면 작동하는
        리모컨이 지워지거나 프로그래밍 모드에 들어가지 못할 수 있습니다. 문이 잠겼다가 열리며 프로그래밍 모드를 확인하지 않으면
        멈추세요. 열쇠 기술자나 딜러가 마칠 수 있습니다.
      notes:
        - text: 설명서 제목 자체가 부품 번호 21997127이고, 인쇄된 순서를 쓸 수 있는 차에 2003-2007 Chevrolet
            Silverado 1500이 들어 있습니다. 2005-2006 Equinox, 2006 Torrent, 2002-2003
            Vue 소유자에게는 진단기를 쓰라고 합니다. 그 예외는 이 트럭이 아닙니다.
      steps:
        - text: 모든 문을 닫습니다.
        - text: 점화 키를 점화 잠금 실린더에 넣습니다.
        - text: 도어 잠금 해제 스위치를 누르고 있습니다.
        - text: 그 스위치를 잠금 해제 위치로 누른 채 점화를 ON, OFF, ON, OFF 순으로 돌립니다.
        - text: 잠금 해제 스위치에서 손을 뗍니다. 문이 한 번 잠겼다가 열리면 트럭이 프로그래밍 모드입니다.
        - text: 리모컨 하나에서 Lock과 Unlock을 함께 누르고, 문이 다시 잠겼다가 열릴 때까지 기다립니다. 설명서와 여기서 연 GM 정비
            절차는 그 확인이 약 15초 뒤에 온다고 합니다. North Coast Keyless의 이 트럭 프로그래밍 페이지는 같은
            누름이 최대 30초까지 걸릴 수 있다고 합니다.
        - text: 남길 리모컨마다 Lock과 Unlock을 누르고 있는 동작을 반복합니다. 같은 차례에 최대 네 개입니다.
        - text: 점화를 RUN으로 돌려 프로그래밍 모드를 나가고, 각 리모컨의 잠금, 잠금 해제, Panic을 시험합니다.
