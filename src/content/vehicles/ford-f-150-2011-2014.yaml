      keyhead transmitter: it starts the truck and operates the locks. Car and
      Truck Remotes sells a 3-button remote (Lock, Unlock, Panic) for a
      turn-the-key F-150 and says it replaces that factory remote. That is a
      remote-head key, not a separate fob and not a push-button smart key."
