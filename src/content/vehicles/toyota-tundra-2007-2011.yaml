troubleshooting:
  - id: no-mode-answer
    title: "The locks do not answer after the ignition count"
    text: "The 2007 figure and the service text say zero, four, or six or more
      ON-to-OFF cycles get no lock response. The count has to be one, two,
      three, or five, about one second apart, and the earlier door and key steps
      have to stay inside their time limits."
    sourceIds:
      - tundra-2007
  - id: two-cycles
    title: "The locks cycle twice after the remote button"
    text: "Two lock-unlock cycles mean that remote was not stored. The pages say
      to start the whole sequence again. One cycle means it was stored."
    sourceIds:
      - tundra-2007
  - id: rewrite-erases
    title: "A working remote stopped working"
    text: "Rewrite mode erases every code already stored. Add mode erases the
      oldest code once the truck is asked to hold more than four. Program every
      remote you want to keep in the same session."
    sourceIds:
      - tundra-2007
      - tundra-2009
