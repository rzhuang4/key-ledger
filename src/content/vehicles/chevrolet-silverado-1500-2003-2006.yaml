          Classic 2007.
    ignitionKeyNote: A página da Keysolved do Silverado 1500 1999-2007 lista a chave
      de ignição como um aço liso B102 sem chip, e o sistema como GM Passlock no
      módulo da carroceria, não como um transponder na chave. Diz que cobre
      todas as picapes 1999-2006 e a Classic 2007. A mesma página lista um
      controle keyless separado de 3 botões, FCC LHJ011, para 2003-2006 e a
      Classic 2007. Isso não acrescenta passos para cortar essa lâmina.
    troubleshooting:
      - id: no-cycle
        title: As travas não ciclam de jeito nenhum
        text: A página de programação da North Coast Keyless para o Silverado 2005 diz
          que, se as travas nunca ciclarem, você pode estar girando a chave
          rápido ou devagar demais, o sistema keyless pode ter um problema, ou a
          picape pode não ter keyless. Ela manda consultar um chaveiro ou uma
          concessionária. As páginas de serviço da GM abertas dizem que as
          travas devem ciclar ao soltar o interruptor de destravar. Elas não
          trazem essa divisão.
      - id: early-cycle
        title: As travas ciclam antes de soltar o interruptor
        text: A mesma página da North Coast diz que um ciclo antes de soltar o botão de
          destravar significa que a picape não entrou no modo de programação e é
          preciso recomeçar. Se as travas continuam ciclando antes de soltar o
          botão, essa página diz que o sistema keyless tem um problema e que um
          chaveiro ou uma concessionária precisa programar os controles. As
          páginas de serviço da GM abertas não trazem esse teste de ciclo cedo.
      - id: no-response
        title: O controle não dá uma segunda resposta
        text: A North Coast diz para segurar Lock e Unlock juntos por até 30 segundos,
          até as travas ciclarem de novo. As páginas de serviço da GM abertas
          dizem que essa confirmação chega após cerca de 15 segundos. Nenhuma
          das duas dá um teste separado para um controle que continua mudo
          depois que as travas já ciclaram para confirmar o modo. Esse caso é
          desconhecido aqui.
  de:
    title: Funkschlüssel-Programmierung Chevrolet Silverado 1500 2003-2006
    description: Schritte im Fahrzeug für den Keyless-Sender des Silverado 1500
      2003-2006, mit FCC-ID LHJ011, Teilenummern, Batterie und belegten Preisen.
    summary: Der Keyless-Sender eines Chevrolet Silverado 1500 2003-2006 lässt sich
      an der Zündung programmieren, ohne Diagnosegerät. Das Blatt zur
      Teilenummer 21997127 nennt diesen Truck und druckt die Tastenfolge. Der
      Sender ist getrennt, nicht der Metallzündschlüssel.
    scope: Leichter Silverado 1500, 2003 bis 2006, US-Markt. Dasselbe Blatt nennt
      auch den Silverado 1500 2007 und mehrere HD. Die liegen außerhalb dieser
      Seite. Ein Truck ohne werkseitiges Keyless hat keinen Empfänger für diesen
      Sender.
    diy:
      summary: Programmieren Sie jeden Sender, den Sie behalten wollen, in derselben
        Sitzung. Das Blatt sagt, bereits gespeicherte Sender werden gelöscht,
        sobald der erste neue angenommen wird. Diese Folge programmiert nur den
        Keyless-Sender.
      condition: Sie brauchen einen passenden Sender und den Zündschlüssel, der den
        Schließzylinder dreht. Das schneidet keinen Metallschlüssel.
      safetyNote: Das Blatt sagt, der erste in dieser Sitzung angenommene Sender
        löscht die, die der Truck schon kennt. Eine falsche Reihenfolge kann
        funktionierende Sender löschen oder den Programmiermodus verfehlen. Wenn
        die Türen nicht verriegeln und entriegeln, um den Modus zu bestätigen,
        hören Sie auf. Ein Schlüsseldienst oder der Händler kann die Arbeit
        beenden.
      notes:
        - text: Die Überschrift des Blatts selbst ist Teilenummer 21997127 und nennt den
            Chevrolet Silverado 1500 2003-2007 unter den Fahrzeugen für die
            gedruckte Folge. Für Equinox 2005-2006, Torrent 2006 und Vue
            2002-2003 verlangt es ein Diagnosegerät. Diese Ausnahmen sind nicht
            dieser Truck.
      steps:
        - text: Schließen Sie alle Türen.
        - text: Stecken Sie den Zündschlüssel in den Zündschließzylinder.
        - text: Halten Sie den Türentriegelungsschalter gedrückt.
        - text: Halten Sie diesen Schalter in der Entriegelstellung und drehen Sie die
            Zündung auf ON, OFF, ON, OFF.
        - text: Lassen Sie den Entriegelungsschalter los. Die Türen verriegeln und
            entriegeln einmal und bestätigen den Programmiermodus.
        - text: Auf einem Sender Lock und Unlock zusammen halten, bis die Türen wieder
            verriegeln und entriegeln. Das Anweisungsblatt und die hier
            geöffneten GM-Serviceverfahren sagen, dass diese Bestätigung nach
            etwa 15 Sekunden kommt. Die Programmierseite von North Coast Keyless
            für diesen Truck sagt, dass dasselbe Halten bis zu 30 Sekunden
            dauern kann.
        - text: Wiederholen Sie das Halten von Lock und Unlock für jeden Sender, den Sie
            behalten wollen, höchstens vier, in derselben Sitzung.
        - text: Drehen Sie die Zündung auf RUN, um den Programmiermodus zu verlassen, und
            prüfen Sie Verriegeln, Entriegeln und Panic an jedem Sender.
    variants:
      - id: lhj011-3-button
        name: Keyless-Sender mit 3 Tasten
        years: 2003-2006
        keyTypeNote: Während des Ablaufs bleibt der Zündschlüssel im Zylinder, und Sie
          drücken einen separaten Sender. Car and Truck Remotes verkauft das
          passende Angebot als Keyless-Sender für Trucks mit Drehschlüssel,
