  de:
    title: Programmierung und Teilenummern des Honda CR-V 2012-2016
    description: Wegfahrsperrenschlüssel des Honda CR-V 2012-2016 brauchen ein
      Diagnosegerät. FCC-IDs, Teilenummern, Batterien und Händlerpreise, jeweils
      mit Quelle.
    summary: Honda-Serviceunterlagen zum CR-V 2012-2016 sagen, zum Anlernen eines
      Wegfahrsperrenschlüssels sei das Honda-Diagnosesystem (HDS) nötig, und
      dieselbe Arbeit programmiere auch den Keyless-Sender. Diese Seite gibt
      keine Tastenfolge im Fahrzeug. In den Teileangeboten stehen zwei
      verschiedene Fernbedienungsschlüssel, und die Händler sind sich bei
      2012-2013 nicht über eine einzige Teilenummer einig.
    scope: CR-V der vierten Generation, Modelljahre 2012 bis 2016, US-Markt,
      Fernbedienungsschlüssel mit Bart. Die Händler unten schließen
      Startknopf-Smart-Keys aus, und diese Seite gibt ihnen keine eigene FCC-ID.
      Ein Schlüssel von 2012 und einer von 2015 gelten nicht als dasselbe Teil.
    diy:
      summary: Ein Serviceablauf des CR-V LX 2012 und ein Service-Nachdruck des CR-V
        2012-2016 sagen, zum Registrieren von Wegfahrsperrenschlüsseln sei das
        HDS nötig. Das Programmieren der Wegfahrsperre programmiert auch den
        Keyless-Sender. Das Steuergerät speichert bis zu sechs Schlüssel. Im
        LX-2012-Text braucht das Hinzufügen einen bereits registrierten
        Schlüssel und das erste Passwort aus Hondas iN-System. Sind alle
        Schlüssel weg, verlangt der Text den PCM-Code der Wegfahrsperre. Das
        sind Werkstattschritte. Sie werden hier nicht als etwas zum Ausprobieren
        in der Einfahrt nachgedruckt.
      condition: Tom's Key verkauft ein separates Programmiergerät und sagt,
        mindestens ein funktionierender Schlüssel sei nötig. Das bleibt ein
        Werkzeug, keine Programmierung im Fahrzeug. Car Keys Express sagt, der
        Bart müsse geschnitten werden.
      safetyNote: Auf dieser Seite gibt es keine Folge im Fahrzeug. Zündzyklen oder
        Tastenkombinationen zu raten kann einen Schlüssel unerkannt lassen, und
        dann müssen Schlüsseldienst oder Honda-Händler das System mit dem
        richtigen Gerät wiederherstellen. Hören Sie auf, wenn Sie dieses Gerät
        und das Passwort oder den Wegfahrsperrencode aus der Serviceanweisung
        nicht haben.
    variants:
      - id: remote-head-2012-2013
        name: Fernbedienungsschlüssel mit 3 Tasten
        years: Von Händlern für 2012-2013 genannt, von manchen für 2007-2013
        keyTypeNote: "Car Keys Express nennt das eine Kombination aus Sender und
          Schlüssel, also einen Fernbedienungsschlüssel: ein Zündschlüssel mit
          Transponder plus Lock, Unlock und Panic. Tom's Key verkauft denselben
          3-Tasten-Schlüssel und sagt, er passe nicht zu Startknopf."
        fccNotes:
          - FCC-Zulassung für Honda Lock Mfg. Co., Ltd., Modell HLIK-1T,
            Keyless-Sender. Datum 9. Mai 2006. Die Frequenz der Zulassung ist
            313,85 MHz. Car Keys Express, Tom's Key und MK3 drucken MLBHLIK-1T
            auf CR-V-Fernbedienungsschlüssel.
        partNotes:
          - MK3 nennt das die OEM-Teilenummer für einen CR-V-Sender 2012-2013.
            Die unten geprüften US-Händler drucken andere Nummern. Nicht in
            einer Honda-Teileliste bestätigt.
          - Tom's Key nennt das die Teilenummer, die der
            3-Tasten-Nachrüstschlüssel ersetzen soll. Das Angebot umfasst auch
            andere Honda, nicht nur den CR-V.
          - Car Keys Express nennt HLIK-1T eine Teilenummer. Dieselbe
            Zeichenfolge ist auch das FCC-Modell. Behandeln Sie sie als
            Händleretikett, nicht als Beweis, dass es die
            Honda-Teilethekennummer ist.
          - Von Car Keys Express gedruckte Strattec-Nummer.
        batteryNote: MK3 nennt CR1616. Die FCC-Zulassung nennt die Zelle nicht. Die hier
          geprüften Seiten von Tom's Key und Car Keys Express listen für diesen
          Schlüssel keine Batterie.
        frequencyNote: Das ist die Frequenz der Zulassung. Die MK3-Seite sagt 315 MHz
          für dieselbe FCC-ID. Nehmen Sie die Zahl der Zulassung und gleichen
          Sie die ID auf dem Schlüssel ab, nicht eine gerundete Händlerfrequenz.
        sellerClaims:
          - Tom's Key nennt den Chip Philips 46. MK3 nennt die Transponder-ID
            PCF7961A. Diese Angaben wurden nicht mit einem Honda-Dokument
            abgeglichen und sind nicht dasselbe Etikett.
          - Tom's Key druckt neben MLBHLIK-1T auch MLBHL1K-1T. Die zusätzliche
            Schreibweise entspricht nicht der FCC-Zulassung. Lesen Sie die ID
            auf dem Schlüssel Zeichen für Zeichen.
      - id: remote-head-2014-2016
        name: Fernbedienungsschlüssel mit 4 Tasten
        years: 2014-2016
        keyTypeNote: Tom's Key und Keys4Less verkaufen einen
          4-Tasten-Fernbedienungsschlüssel für den CR-V 2014-2016, mit
          Verriegeln, Entriegeln, Panic und Heckklappen- oder Kofferraumöffnung.
          Beide nennen die FCC-ID MLBHLIK6-1T. Tom's Key sagt, er passe nicht
          zum Startknopf. Keys4Less ordnet ihn als Fernbedienungsschlüssel ein.
        fccNotes:
          - FCC-Zulassung für Honda Lock Mfg. Co., Ltd., Modell HLIK6-1T,
            Keyless-Sender. Datum 6. Februar 2012. Frequenz der Zulassung 313,85
            MHz. Keys4Less druckt auch MLBHLIK61T ohne Bindestrich; die
            Zulassung verwendet MLBHLIK6-1T.
        partNotes:
          - Von Tom's Key und Keys4Less gedruckt. Nicht in einer
            Honda-Teileliste bestätigt. Keys4Less druckt auch die Form ohne
            Bindestriche 35118T7SA00.
          - Von Tom's Key und Keys4Less gedruckt. Keys4Less druckt auch
            35118T0AA30.
        batteryNote: Keys4Less nennt CR1620. Die 2014-2016-Seite von Tom's Key listet
          keine Batterie. Die FCC-Zulassung nennt die Zelle nicht.
        frequencyNote: Frequenz der Zulassung. Keys4Less sagt 314 MHz. Die Seite von
          Tom's Key nennt keine Frequenz.
        sellerClaims:
          - Tom's Key nennt den Transponder Philips 47. Das wurde nicht mit
            einem Honda-Dokument abgeglichen.
    priceNotes:
      - "Geprüft am 19. November 2026 über die Shopify-JSON. Der
        3-Tasten-Artikel, Passung einschließlich CR-V 2007-2013, meldete
