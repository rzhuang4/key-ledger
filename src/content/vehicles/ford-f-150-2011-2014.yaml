  es:
    title: Programación de la llave con mando del Ford F-150 2011-2014
    description: Notas de programación con dos llaves para la llave con mando de la
      F-150 2011-2014, ID FCC CWTWB1U793, números de pieza y dónde las fuentes
      no coinciden.
    summary: La guía del propietario de la F-150 2013 dice que usted puede programar
      su propio transmisor de cabeza integrada si ya tiene dos llaves
      programadas. La página actual de Ford describe el mismo tipo de llave y
      usa otros tiempos de pulsación. Un vendedor de piezas de la camioneta 2013
      dice que no hay programación a bordo. Esas diferencias se explican abajo.
    scope: Camionetas Ford F-150 2011-2014 con transmisor de cabeza integrada y
      hoja, a menudo vendidas como llave con mando de 3 botones e ID FCC
      CWTWB1U793. Los tiempos de abajo salen de una transcripción de la guía de
      2013, no de los libros de 2011, 2012 o 2014. Las llaves Intelligent Access
      de botón no están cubiertas.
    diy:
      summary: Hay una programación a bordo publicada para un transmisor de cabeza
        integrada cuando dos llaves codificadas ya funcionan. Sin esas dos,
        tanto la transcripción de 2013 como la página de Ford lo envían al
        concesionario.
      condition: Hacen falta dos llaves codificadas ya programadas y un transmisor de
        cabeza integrada o una llave SecuriLock nuevos, sin programar. La hoja
        igual hay que cortarla. Car and Truck Remotes dice que no corta ni
        programa el mando que vende.
      safetyNote: Los tiempos de pulsación no coinciden entre las fuentes de esta
        página. Una secuencia incorrecta puede dejar la llave nueva sin
        programar. Si todavía no tiene dos llaves que funcionen, el método a
        bordo no aplica y necesita un concesionario o un cerrajero. Si un
        intento cuidadoso falla, deténgase y deje que un cerrajero o el
        concesionario terminen el trabajo.
      notes:
        - text: La transcripción de 2013 dice que el procedimiento programa el código del
            inmovilizador del motor y los botones del mando, y que solo vale
            para transmisores de cabeza integrada o llaves SecuriLock normales.
            Admite como máximo ocho llaves codificadas, y solo cuatro de esas
            ocho pueden ser transmisores de cabeza integrada.
        - text: "La ficha de Car and Truck Remotes de la F-150 2013 dice “On Board
            Programming: No” y que un cerrajero debe cortar y programar el mando
            de forma profesional. Eso contradice la transcripción de la guía y
            la página de Ford. El vendedor también dice que un concesionario
            puede negarse a programar un mando de posventa."
      steps:
        - text: Tenga a mano dos llaves codificadas ya programadas y la llave nueva sin
            programar. Lea toda la secuencia antes de empezar. El texto sigue la
            Owner's Guide del F-150 2013, 1.ª impresión, transcrita por Auto
            Guide Galaxy. Este sitio no abrió el PDF original de Ford.
        - text: Inserte la primera llave programada. Gire el encendido de off a on y
            déjelo al menos 3 segundos y no más de 10. Vuélvalo a off y saque la
            llave.
        - text: Después de 3 segundos, pero dentro de 10 segundos de sacar la primera
            llave, inserte la segunda llave programada. Ponga el encendido en on
            al menos 1 segundo y no más de 10. Vuélvalo a off y sáquela.
        - text: Después de 3 segundos, pero dentro de 10 segundos de sacar la segunda
            llave, inserte la llave nueva sin programar. Encendido en on al
            menos 1 segundo y no más de 10, luego sáquela.
        - text: Si funcionó, la llave nueva arranca el motor. Si es un transmisor de
            cabeza integrada, también opera la entrada remota. Si falló, la
            transcripción dice esperar 20 segundos y repetir, y luego llevar la
            camioneta a un concesionario autorizado.
    comparisons:
