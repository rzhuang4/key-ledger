  ko:
    title: 2012-2016 Honda CR-V 키 프로그래밍과 부품 번호
    description: 2012-2016 Honda CR-V 이모빌라이저 키에는 진단기가 필요합니다. FCC ID, 부품 번호, 배터리, 판매
      가격은 각각 출처가 있습니다.
    summary: 2012-2016 CR-V Honda 정비 페이지는 이모빌라이저 키 등록에 Honda 진단 시스템(HDS)이 필요하고, 같은
      작업이 키리스 송신기도 프로그래밍한다고 합니다. 이 페이지에는 차 안 버튼 순서가 없습니다. 부품 페이지에 서로 다른 리모컨 헤드
      키가 두 가지 나오고, 2012-2013 부품 번호는 판매자마다 하나로 모이지 않습니다.
    scope: 4세대 CR-V, 2012년부터 2016년, 미국 시장, 날이 있는 리모컨 헤드 키입니다. 아래 판매자는 버튼 시동 스마트 키를
      빼고, 이 페이지도 그 키만의 FCC ID를 주지 않습니다. 2012년 키와 2015년 키는 같은 부품으로 보지 않습니다.
    diy:
      summary: 2012 CR-V LX 정비 절차와 2012-2016 CR-V 정비 전재는 모두 이모빌라이저 키 등록에 HDS가 필요하다고
        합니다. 이모빌라이저를 프로그래밍하면 키리스 송신기도 프로그래밍됩니다. 제어 장치는 이모빌라이저 키를 최대 여섯 개 저장합니다.
        2012 LX 문장은 키를 하나 추가하려면 이미 등록된 키와 Honda iN 시스템의 첫 비밀번호가 필요하다고 합니다. 모든 키를
        잃으면 그 문장은 이모빌라이저 PCM 코드를 요구합니다. 이것은 가게 절차이며, 여기서 차도에서 시험할 절차로 다시 적지
        않습니다.
      condition: Tom's Key는 별도 프로그래머를 팔며, 쓰려면 작동하는 키가 적어도 하나 필요하다고 합니다. 그것은 여전히 도구이지 차
        안 프로그래밍이 아닙니다. Car Keys Express는 날을 깎아야 한다고 합니다.
      safetyNote: 이 페이지에는 차 안 순서가 없습니다. 점화 사이클이나 버튼 조합을 짐작하면 키가 인식되지 않을 수 있고, 그다음 열쇠
        기술자나 Honda 딜러가 맞는 도구로 복구해야 합니다. 그 도구와 정비 절차가 쓰는 비밀번호 또는 이모빌라이저 코드가 없으면
        멈추세요.
