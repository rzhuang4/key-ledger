# 2003–2006 Chevrolet Silverado 1500. Copy this file to add a page. Rules: README.md.
make: Chevrolet
makeSlug: chevrolet
model: Silverado 1500
modelSlug: silverado-1500
yearStart: 2003
yearEnd: 2006
yearSlug: "2003-2006"
market: US
title: "2003-2006 Chevrolet Silverado 1500 key fob programming"
description: "On-board steps for the 2003-2006 Silverado 1500 keyless remote,
  with FCC ID LHJ011, part numbers, battery, and sourced prices."
summary: "The keyless-entry remote on a 2003-2006 Chevrolet Silverado 1500 can
  be programmed at the ignition, without a scan tool. An instruction sheet for
  part 21997127 lists that truck and prints the button sequence. The remote is a
  separate fob, not the metal ignition key."
scope: "Light-duty Silverado 1500, 2003 through 2006, US market. The same
  instruction sheet also names 2007 Silverado 1500 and several HD models. Those
  trucks are outside this page. A truck that was not built with keyless entry
  has nothing for this remote to talk to."
reviewed: "2026-11-19"
diy:
  status: "yes"
  summary: "Program every remote you want to keep in one session. The sheet says
    transmitters already stored are erased when the first new transmitter is
    accepted. This sequence programs the keyless remote only."
  condition: "You need a compatible remote and the ignition key that turns the
    lock cylinder. This does not cut a metal key."
  safetyNote: "The instruction sheet says the first remote accepted in this
    session erases remotes the truck already knows. A wrong sequence can wipe
    working remotes or never enter program mode. If the doors do not lock and
    unlock to confirm program mode, stop. A locksmith or dealer can finish the
    job."
  sourceIds:
    - acdelco-sheet
  notes:
    - text: "The sheet's own heading is part number 21997127, and it includes
        2003-2007 Chevrolet Silverado 1500 among the vehicles that can use the
        printed sequence. It tells owners of a 2005-2006 Equinox, 2006 Torrent,
        and 2002-2003 Vue to use a scan tool instead. Those exceptions are not
        this truck."
      sourceIds:
        - acdelco-sheet
  steps:
    - text: "Close all the doors."
      sourceIds:
        - acdelco-sheet
    - text: "Insert the ignition key into the ignition lock cylinder."
      sourceIds:
        - acdelco-sheet
    - text: "Press and hold the door unlock switch."
      sourceIds:
        - acdelco-sheet
    - text: "While holding that switch in the unlock position, cycle the ignition ON,
        OFF, ON, OFF."
      sourceIds:
        - acdelco-sheet
    - text: "Release the unlock switch. The doors lock and unlock once to confirm that
        the truck is in program mode."
      sourceIds:
        - acdelco-sheet
    - text: "On one remote, press and hold Lock and Unlock together until the doors
        lock and unlock again. The instruction sheet and the opened GM service
        procedures say that confirmation comes after about 15 seconds. North
        Coast Keyless's programming page for this truck says the same hold can
        take up to 30 seconds."
      sourceIds:
        - acdelco-sheet
        - gm-2005-hybrid
        - gm-2007-classic
        - nck-2005-steps
    - text: "Repeat the Lock-and-Unlock hold for each remote you want the truck to
        keep, up to four, in the same session."
      sourceIds:
        - acdelco-sheet
    - text: "Turn the ignition to RUN to leave programming mode, then test lock,
        unlock, and panic on every remote."
      sourceIds:
        - acdelco-sheet
