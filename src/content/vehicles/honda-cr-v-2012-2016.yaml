        sellerClaims:
          - Tom's Key indique la puce comme Philips 46. MK3 indique l’ID
            transpondeur PCF7961A. Ces affirmations n’ont pas été confrontées à
            un document Honda et ne sont pas la même étiquette.
          - Tom's Key imprime aussi MLBHL1K-1T à côté de MLBHLIK-1T. Cette
            graphie en plus ne correspond pas à l’autorisation FCC. Lisez l’ID
            sur la clé caractère par caractère.
      - id: remote-head-2014-2016
        name: Clé à télécommande à 4 boutons
        years: 2014-2016
        keyTypeNote: Tom's Key et Keys4Less vendent une clé à télécommande 4 boutons
