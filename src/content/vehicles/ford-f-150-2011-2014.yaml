      합니다. Ford의 현재 안내 페이지는 같은 종류의 키를 설명하지만 누르는 시간이 다릅니다. 2013년 트럭 부품 판매자는 차 안
      프로그래밍이 없다고 합니다. 그 차이는 아래에 적습니다.
    scope: 날이 있는 일체형 키헤드 송신기를 쓰는 2011-2014 Ford F-150입니다. FCC ID CWTWB1U793의 버튼 3개
      리모컨 헤드 키로 팔리는 경우가 많습니다. 아래 누르는 시간은 2013 사용 설명서 전사본이며 2011, 2012, 2014년 책이
      아닙니다. 버튼 시동 Intelligent Access 키는 다루지 않습니다.
    diy:
      summary: 일체형 키헤드 송신기는 작동하는 코드 키가 두 개 있을 때 차 안 프로그래밍이 공개되어 있습니다. 그 두 개가 없으면 2013
        전사본과 Ford 안내 페이지 모두 딜러로 보냅니다.
      condition: 이미 프로그래밍된 코드 키 두 개와, 아직 프로그래밍되지 않은 일체형 키헤드 송신기 또는 SecuriLock 키 하나가
        필요합니다. 날은 따로 깎아야 합니다. Car and Truck Remotes는 파는 리모컨을 깎거나 프로그래밍하지 않는다고
        합니다.
      safetyNote: 이 페이지 출처의 누르는 시간이 일치하지 않습니다. 순서를 잘못하면 새 키가 프로그래밍되지 않을 수 있습니다. 작동하는
        키가 두 개 없으면 차 안 방법은 해당되지 않고 딜러나 열쇠 기술자가 필요합니다. 조심스럽게 한 번 해서 실패하면 멈추고 열쇠
        기술자나 딜러가 마치게 하세요.
      notes:
        - text: 2013 전사본은 이 절차가 엔진 이모빌라이저 코드와 리모컨 버튼을 함께 프로그래밍하고, 일체형 키헤드 송신기나 표준
            SecuriLock 키에만 된다고 합니다. 코드 키는 최대 여덟 개이고 그중 일체형 키헤드 송신기는 네 개까지입니다.
        - text: "Car and Truck Remotes의 2013 F-150 상품은 “On Board Programming: No”라고 하고,
            리모컨은 열쇠 기술자가 전문적으로 깎고 프로그래밍해야 한다고 합니다. 이는 사용 설명서 전사본과 Ford 안내 페이지와
            반대입니다. 판매자는 딜러가 애프터마켓 리모컨 프로그래밍을 거절할 수 있다고도 합니다."
      steps:
        - text: 이미 프로그래밍된 코드 키 두 개와 아직 프로그래밍되지 않은 새 키를 손에 닿게 둡니다. 시작 전에 순서 전체를 읽으세요. 표현은
            Auto Guide Galaxy가 옮긴 2013 F-150 Owner's Guide 1차 인쇄를 따릅니다. 이 사이트는
            Ford 원본 PDF를 열지 않았습니다.
        - text: 첫 번째 프로그래밍된 키를 꽂습니다. 점화를 off에서 on으로 돌리고 3초 이상 10초 이하로 둔 뒤 off로 돌려 뺍니다.
        - text: 첫 키를 뺀 뒤 3초가 지난 후, 그러나 10초 안에 두 번째 프로그래밍된 키를 꽂습니다. on을 1초 이상 10초 이하로 둔 뒤
            off로 돌려 뺍니다.
        - text: 두 번째 키를 뺀 뒤 3초가 지난 후, 그러나 10초 안에 아직 프로그래밍되지 않은 새 키를 꽂습니다. on을 1초 이상 10초
            이하로 둔 뒤 뺍니다.
        - text: 성공하면 새 키로 엔진이 걸립니다. 일체형 키헤드 송신기이면 리모컨 문 열림도 됩니다. 실패하면 전사본은 20초 기다렸다가 반복하고,
            그다음 공식 딜러로 가져가라고 합니다.
