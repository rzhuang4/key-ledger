troubleshooting:
  - id: no-cycle
    title: "The locks never cycle"
    text: "Chrome wrote that a 2015 base manual truck never entered programming
      mode. A dealer, and later a master mechanic, told him that truck had no
      radio hardware for a fob. Defvayne wrote that the door sequence needs the
      factory receiver."
    sourceIds:
      - tw-2015-procedure
  - id: two-cycles
    title: "The locks cycle twice"
    text: "The Toyota registration pages say two lock cycles mean the code was
      not registered. theferalkid wrote that on a 2015 the locks cycled twice
      and the remote still worked after another Lock press. That is one owner's
      report, not the service page."
    sourceIds:
      - charm-2011
      - lemon-2015
      - tw-2015-procedure
ignitionKey:
  status: verified
  blade: TR47
  transponder: present
  sourceIds:
    - ctr-key-2008
    - ctr-key-2012
    - ctr-key-2016
    - mle-tacoma
    - tw-2015-procedure
  note: "The remote procedure does not program this chip. Check the stamp on
    the key head. Car and Truck Remotes' 2008 Tacoma key is TOY44D, Texas 4D
    67, marked as a Dot chip, test key TR47, and the page lists it for
    2005-2010 Tacoma with a note that some 2010 trucks use a dot chip and some
    use a G chip. The 2012 Tacoma key page is a G chip, TOY44G, OE
    89785-08040, keyway TR47, chip ID Texas 4D 72 G chip, and it lists
    2010-2015 Tacoma with the same 2010 note. So 2005-2009 reads as the dot
    chip, 2010 can be either, and 2010-2015 is the G chip on that page. The
    2016 Tacoma key page is an H chip, TOY44H, for 2016-2018. My Locksmith
    Express lists a G chip for all of 2005-2015, which does not match the
    2008 key page. A 2013 owner wrote that the metal key needs a computer and
    that the fob is a different job."
