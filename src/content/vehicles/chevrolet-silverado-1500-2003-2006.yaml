  ja:
    title: 2003-2006 Chevrolet Silverado 1500 のキーフォブ登録
    description: 2003-2006 Silverado 1500 のキーレスリモコンを車内で登録する手順。FCC ID LHJ011、部品番号、電池、出典のある価格。
    summary: 2003-2006 Chevrolet Silverado 1500 のキーレスリモコンは、診断機なしでイグニッション側から登録できます。部品
      21997127 の手順書がこのトラックを挙げ、ボタン順を載せています。リモコンは別体で、金属のイグニッションキーではありません。
    scope: ライトデューティの Silverado 1500、2003 年から 2006 年、米国市場です。同じ手順書は 2007 年 Silverado
      1500 と複数の HD
      も挙げています。それらはこのページの外です。工場でキーレスが付いていないトラックには、このリモコンが話す受信機がありません。
    diy:
      summary: 残したいリモコンはすべて同じ回で登録します。手順書は、最初の新しい送信機が受け付けられた時点で、以前入っていた送信機は消えると書いています。この順番が登録するのはキーレスリモコンだけです。
      condition: 互換リモコンと、ロックシリンダーを回すイグニッションキーが必要です。金属キーのカットはしません。
      safetyNote: 手順書は、この回で最初に受け付けられたリモコンが、トラックが既に覚えているリモコンを消すと書いています。順番を誤ると、動くリモコンが消えるか、登録モードに入れないことがあります。ドアが施錠して解錠し、登録モードを示さないときは止めてください。鍵屋かディーラーが仕上げられます。
      notes:
        - text: 手順書の見出し自体が部品番号 21997127 で、印刷された順番を使える車に 2003-2007 Chevrolet Silverado 1500
            を含めています。2005-2006 Equinox、2006 Torrent、2002-2003 Vue
            の所有者には診断機を使うよう書いています。それらの例外はこのトラックではありません。
      steps:
        - text: すべてのドアを閉めます。
        - text: イグニッションキーをイグニッションのロックシリンダーに差し込みます。
        - text: ドアの解錠スイッチを押し続けます。
        - text: そのスイッチを解錠位置で押したまま、イグニッションを ON、OFF、ON、OFF の順に回します。
        - text: 解錠スイッチを放します。ドアが一度施錠して解錠すれば、トラックは登録モードです。
        - text: リモコン 1 個で Lock と Unlock を同時に押し続け、ドアが再び施錠して解錠するまで待ちます。説明書と、ここで開いた GM
            の修理手順は、その確認がおよそ 15 秒後だと書いています。North Coast Keyless
            のこのトラック向けページは、同じ押し続けが最大 30 秒かかることがあると書いています。
        - text: 残したいリモコンごとに Lock と Unlock の長押しを繰り返します。同じ回で最大 4 個です。
        - text: イグニッションを RUN にして登録モードを抜け、各リモコンの施錠、解錠、Panic を試します。
    variants:
