            - 至少 3 秒，不超過 10 秒
        - action: 插入第二把鑰匙之前的等待
          values:
            - 取出第一把鑰匙後過 3 秒，但在 10 秒內
            - 點火轉到 off 之後過 3 秒，但在 10 秒內
        - action: 第二把已編程鑰匙保持在 on
