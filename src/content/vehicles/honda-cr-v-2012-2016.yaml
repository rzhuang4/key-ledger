i18n:
  zh-hant:
    title: 2012-2016 Honda CR-V 鑰匙編程與零件號
    description: 2012-2016 Honda CR-V 的防盜晶片鑰匙需要診斷機。FCC ID、零件號、電池與賣家價格都各有出處。
    summary: 2012-2016 CR-V 的 Honda 維修頁說，登記防盜晶片鑰匙需要 Honda
      診斷系統（HDS），同一項工作也會編程免鑰匙發射器。本頁沒有給車主車上按鍵順序。零件頁出現兩種不同的遙控頭鑰匙，賣家對 2012-2013
      沒有一致的單一零件號。
    scope: 第四代 CR-V，2012 至 2016 年式，美國市場，帶齒片的遙控頭鑰匙。下面的賣家排除按鈕啟動的智慧鑰匙，本頁也沒有給那種鑰匙自己的 FCC
      ID。2012 的鑰匙和 2015 的鑰匙不當成同一零件。
    diy:
      summary: 2012 CR-V LX 的維修程序和一份 2012-2016 CR-V 維修轉載都說，登記防盜晶片鑰匙需要
        HDS。編程防盜也會編程免鑰匙發射器。控制單元最多存六把防盜鑰匙。2012 LX 的文字說，加一把鑰匙需要一把已經登記的鑰匙，以及 Honda
        iN 系統的第一組密碼。如果所有鑰匙都遺失，那段文字要求防盜 PCM 代碼。那些是店內步驟，這裡不把它們印成可以在車道上試的做法。
      condition: Tom's Key 另售編程器，並說至少要有一把能用的鑰匙才能用它。那仍然是工具，不是車上編程。Car Keys Express 說齒片必須切削。
      safetyNote: 本頁沒有車上順序。猜點火循環或按鈕組合可能讓鑰匙不被認得，之後鎖匠或 Honda
        經銷商必須用正確的工具把系統救回來。如果沒有那個工具，也沒有維修程序要用的密碼或防盜代碼，就停下來。
    variants:
      - id: remote-head-2012-2013
        name: 3 鍵遙控頭鑰匙
        years: 賣家列為 2012-2013，有些列到 2007-2013
        keyTypeNote: Car Keys Express 稱它為遙控器與鑰匙組合，也就是遙控頭鑰匙：帶晶片的點火鑰匙加上 Lock、Unlock 和
          Panic。Tom's Key 販售同類 3 鍵鑰匙，並說它不能用在按鈕啟動的車上。
        fccNotes:
          - Honda Lock Mfg. Co., Ltd. 的 FCC 認證，型號 HLIK-1T，免鑰匙遙控發射器。認證日期 2006 年 5
            月 9 日。認證上的頻率是 313.85 MHz。Car Keys Express、Tom's Key 和 MK3 的 CR-V
            遙控頭鑰匙頁都印了 MLBHLIK-1T。
        partNotes:
          - MK3 把這個號碼列為 2012-2013 CR-V 遙控器的原廠零件。下面查過的美國賣家印的是不同號碼。沒有在 Honda
            零件目錄上確認。
          - Tom's Key 把這個號碼列為其 3 鍵售後鑰匙要替換的零件。該頁也涵蓋其他 Honda 車型，不只 CR-V。
          - Car Keys Express 把 HLIK-1T 列成零件號。那個字串也是 FCC 型號。把它當成賣家的標籤，不要當成它就是
            Honda 零件櫃檯的號碼。
          - Car Keys Express 印出的 Strattec 號碼。
        batteryNote: MK3 寫 CR1616。FCC 認證沒有寫電池。這裡查過的 Tom's Key 和 Car Keys Express
          頁面沒有列出這把鑰匙的電池。
        frequencyNote: 那是認證上的頻率。MK3 的商品頁對同一個 FCC ID 寫 315 MHz。請用認證上的數字，並以鑰匙上的 ID
          為準，不要用賣家四捨五入的頻率。
        sellerClaims:
          - Tom's Key 把晶片寫成 Philips 46。MK3 寫晶片 ID PCF7961A。這些說法沒有對過 Honda
            文件，而且不是同一個標籤。
          - Tom's Key 也在 MLBHLIK-1T 旁邊印了 MLBHL1K-1T。多出來的拼法不符合 FCC 認證。請逐字讀鑰匙上的 ID。
      - id: remote-head-2014-2016
        name: 4 鍵遙控頭鑰匙
        years: 2014-2016
        keyTypeNote: Tom's Key 和 Keys4Less 都販售 2014-2016 CR-V 的 4 鍵遙控頭鑰匙，有上鎖、開鎖、Panic
          和尾門或行李廂釋放。兩者都說 FCC ID 是 MLBHLIK6-1T。Tom's Key 說它不能用在按鈕啟動的車上。Keys4Less
          把它歸在遙控頭鑰匙。
        fccNotes:
          - Honda Lock Mfg. Co., Ltd. 的 FCC 認證，型號 HLIK6-1T，免鑰匙發射器。認證日期 2012 年 2
            月 6 日。認證頻率 313.85 MHz。Keys4Less 也印了沒有連字號的 MLBHLIK61T；認證用的是
            MLBHLIK6-1T。
        partNotes:
          - Tom's Key 和 Keys4Less 都印了這個號碼。沒有在 Honda 零件目錄上確認。Keys4Less 也印了沒有連字號的
            35118T7SA00。
          - Tom's Key 和 Keys4Less 都印了這個號碼。Keys4Less 也印了 35118T0AA30。
        batteryNote: Keys4Less 寫 CR1620。Tom's Key 的 2014-2016 頁面沒有列電池。FCC 認證沒有寫電池。
        frequencyNote: 認證上的頻率。Keys4Less 寫 314 MHz。Tom's Key 的頁面沒有寫頻率。
        sellerClaims:
          - Tom's Key 把晶片寫成 Philips 47。沒有對過 Honda 文件。
    priceNotes:
      - "2026-11-19 依 Shopify 商品 JSON 查閱。含 CR-V 2007-2013 的 3 鍵商品回傳 available:
        true，特價 54.95 美元，比較價 119.99
