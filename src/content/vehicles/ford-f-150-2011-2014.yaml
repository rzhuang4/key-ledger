    summary: 2013 F-150 车主手册说，如果已经有两把编过程的钥匙，车主可以自己编程一体式钥匙头发射器。Ford
      目前的操作说明页描述同一类钥匙，但按住时间不同。2013 年货车的零件卖家说没有车上编程。下面把这些不一致写清楚。
    scope: 使用带齿片的一体式钥匙头发射器的 2011-2014 Ford F-150，常被当成 FCC ID CWTWB1U793 的 3
      键遥控头钥匙出售。下面的按住时间来自 2013 车主手册的转写，不是 2011、2012 或 2014 的书。按钮启动的 Intelligent
      Access 钥匙不在本页。
    diy:
      summary: 一体式钥匙头发射器在已经有两把可用的编码钥匙时，有公开的车上编程。没有那两把钥匙时，2013 手册转写和 Ford 的操作页都要你去经销商。
      condition: 需要两把先前编过程的编码钥匙，以及一把尚未编程的一体式钥匙头发射器或 SecuriLock 钥匙。齿片仍须切削。Car and Truck
        Remotes 说他们不切削也不编程所售的遥控器。
      safetyNote: 本页出处的按住时间不一致。顺序错了可能让新钥匙编不进去。如果还没有两把能用的钥匙，车上方法不适用，需要经销商或锁匠。小心试一次仍失败就停下来，让锁匠或经销商把工作做完。
      notes:
        - text: 2013 转写说这个程序同时编程发动机防盗码和遥控按钮，而且只适用于一体式钥匙头发射器或标准 SecuriLock
            钥匙。最多八把编码钥匙，其中最多四把可以是一体式钥匙头发射器。
        - text: "Car and Truck Remotes 的 2013 F-150 商品页写“On Board Programming:
            No”，并说遥控器必须由锁匠专业切削和编程。这和车主手册转写以及 Ford 的操作页相反。卖家还说经销商可能拒绝编程售后遥控器。"
      steps:
        - text: 把两把先前编过程的编码钥匙和一把尚未编程的新钥匙放在手边。开始前先读完整个顺序。用词依 Auto Guide Galaxy 转写的 2013
            F-150 Owner's Guide 第 1 刷。本站没有打开 Ford 的原始 PDF。
        - text: 插入第一把已编程的钥匙。把点火从 off 转到 on，停留至少 3 秒、不超过 10 秒。转回 off 并取出钥匙。
        - text: 取出第一把钥匙后过 3 秒、但在 10 秒内，插入第二把已编程的钥匙。点火转到 on，至少 1 秒、不超过 10 秒。转回 off 并取出。
        - text: 取出第二把钥匙后过 3 秒、但在 10 秒内，插入尚未编程的新钥匙。点火转到 on，至少 1 秒、不超过 10 秒，然后取出。
        - text: 如果成功，新钥匙能发动发动机。如果它是一体式钥匙头发射器，也能操作遥控开门。如果失败，转写说等 20 秒再重复，然后把货车送到授权经销商。
    comparisons:
      caption: 不要在同一次尝试里混用这些按住时间。左栏是 2013 货车手册转写。右栏是 Ford 目前的一般操作说明，没有指名 F-150。
