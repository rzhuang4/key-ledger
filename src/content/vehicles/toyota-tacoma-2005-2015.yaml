# 2005–2015 Toyota Tacoma. Same FCC ID as the 2007–2011 Tundra remote. 2016+ is out of scope.
make: Toyota
makeSlug: toyota
model: Tacoma
modelSlug: tacoma
yearStart: 2005
yearEnd: 2015
yearSlug: "2005-2015"
market: US
title: "2005-2015 Toyota Tacoma keyless remote programming"
description: "Notes for the 2005-2015 Tacoma 3-button remote, FCC GQ43VT20T
  and part 89742-AE011, with owner reports and USD prices. 2016+ is not covered."
summary: "The 2005-2015 Tacoma keyless remote that sellers list is a separate
  3-button fob, FCC GQ43VT20T, part 89742-AE011. Toyota keyless-entry
  registration pages for these years print a tool-free on-board procedure.
  Aftermarket remote quality varies. A 2006 owner reported one aftermarket
  remote programmed from the seller's instructions."
scope: "Second-generation Tacoma, 2005 through 2015, US market, trucks that
  left the factory with keyless entry and a separate 3-button remote. This page
  does not cover 2016 and later. My Locksmith Express lists those trucks with
  a remote-head key, FCC GQ4-52T, on SR trucks without push-button start, or a
  smart key, FCC HYQ14FBA, on push-button trims. It does not cover a truck that
  was not built with the keyless receiver. A 2015 owner wrote that a dealer and
  later a master mechanic said that truck had no radio hardware for a fob, and
  another 2015 owner wrote that the door sequence needs the factory receiver.
  The remote steps do not program the chip in the metal key. That key has to
  be cut and programmed on its own."
reviewed: "2026-11-20"
diy:
  status: "yes"
  heroAnswer: "Yes, on a 2005-2015 truck that has factory keyless entry. Toyota's registration pages print a tool-free procedure. Aftermarket remote quality varies."
  bottomLine: "For 2005-2015 trucks with factory keyless entry, Toyota service pages print a tool-free on-board procedure. Aftermarket quality varies. The aftermarket owner report on this page is one 2006 truck. Two 2015 owners reported Amazon remotes working, and their posts do not say those remotes were aftermarket."
  heroNotice: "This page does not apply to 2016 and later trucks, to a truck built without factory keyless entry, or to programming the transponder that starts the engine."
  priceCaution: "joes06tacoma, a 2006 owner, wrote that a $20 shipped aftermarket eBay remote from keyless king 'Programmed no problem using his instructions.' That is the aftermarket owner-success report, and it is a 2006 truck. hoffengineering and 565hunter wrote that Amazon remotes worked on 2015 trucks. Their posts do not call those remotes aftermarket. KeylessPros says DIY self-programming is only available for its own remote on 2004-2010 Sienna and Tacoma, and that other models and years need a dealer or locksmith. That is the seller's limit for that product, not a Toyota rule. Chrome wrote that a dealer phone quote was about $202 for a fob and programming. That is one person's report of a quote, not a posted price."
  priceCautionSourceIds:
    - tw-fob-questions
    - tw-2015-procedure
    - amazon-keylesspros
  summary: "The numbered steps are the keyless-entry registration printed on
    the Toyota pages for 2011, 2012, 2013, 2014, and 2015. None of those pages
    uses Techstream. CHARM 2006, 2009, and 2010 print the same sequence.
    Forum posts below are owner reports, not the procedure."
  condition: "Start with no key in the ignition and only the driver door open.
    The procedure registers the remote. It does not program the chip in the
    metal key."
  safetyNote: "A wrong sequence can fail to enter programming mode. Chrome's
    2015 base truck never got the locks to cycle, and a dealer told him the
    truck had no keyless receiver. If the locks do not answer, stop and have a
    locksmith or dealer check whether the truck was built with keyless entry."
  sourceIds:
    - charm-2011
    - charm-2012
    - lemon-2013
    - lemon-2014
    - lemon-2015
  notes:
    - text: "CHARM keyless-entry registration for 2006, 2009, and 2010 prints
        the same switch sequence as the 2011 and 2012 pages, including the
        1.0 to 1.5 second press of Lock and Unlock together. No Techstream
        step is on those pages."
      sourceIds:
        - charm-2006
        - charm-2009
        - charm-2010
    - text: "KeylessPros limits do-it-yourself programming to its own remote
        on 2004-2010 Tacoma. That sentence is the seller's product limit."
      sourceIds:
        - amazon-keylesspros
  steps:
    - text: "No key in the ignition key cylinder, and only the driver door
        open. Insert the key and remove it twice within 5 seconds."
      sourceIds:
        - charm-2011
        - charm-2012
        - lemon-2013
        - lemon-2014
        - lemon-2015
    - text: "Within 40 seconds, close and open the driver door twice, then
        insert the key and remove it."
      sourceIds:
        - charm-2011
        - lemon-2015
    - text: "Within 40 seconds, close and open the driver door twice again.
        Insert the key and close all doors."
      sourceIds:
        - charm-2011
        - lemon-2015
    - text: "Within 40 seconds, turn the ignition from LOCK to ON and back to
        LOCK at about 1 second intervals. Once selects Add mode. Twice selects
        Rewrite mode. Three times selects Confirmation mode. Five times selects
        Prohibition mode. Zero, four, or six or more gets no lock response.
        Remove the key."
      sourceIds:
        - charm-2011
        - charm-2012
        - lemon-2014
        - lemon-2015
    - text: "The locks answer the mode. Add mode cycles once. Rewrite mode
        cycles twice. Prohibition mode cycles five times. In Confirmation mode
        they cycle once for each registered code, or 11 times if nothing is
        registered. Confirmation mode and Prohibition mode end after that
        answer."
      sourceIds:
        - charm-2011
        - charm-2012
        - lemon-2013
        - lemon-2015
    - text: "Within 45 seconds of Add mode or Rewrite mode, press the Lock and
        Unlock switches at the same time for 1.0 to 1.5 seconds. Within 3
        seconds of moving your finger away, press either switch for more than
        1.0 second."
      sourceIds:
        - charm-2011
        - charm-2012
        - lemon-2013
        - lemon-2014
        - lemon-2015
    - text: "Within 5 seconds the locks cycle once if the code was registered,
        or twice if it failed. If it fails, start again. Another remote can be
        registered within 45 seconds of the previous one. Add mode keeps old
        codes until more than four are stored, then drops the oldest. Rewrite
        mode clears the old codes first."
      sourceIds:
        - charm-2012
        - lemon-2013
        - lemon-2015
    - text: "Registration ends if the key is inserted, any door is opened, or
        45 seconds pass after a code is registered."
      sourceIds:
        - charm-2011
        - lemon-2014
        - lemon-2015
scopeCards:
  - label: "2005-2010"
    text: "CHARM keyless-entry registration for 2006, 2009, and 2010 prints
      the tool-free procedure, with no Techstream. joes06tacoma, a 2006 owner,
      wrote that a $20 shipped aftermarket eBay remote 'Programmed no problem
      using his instructions.' That aftermarket report is this year range."
    sourceIds:
      - charm-2006
      - charm-2009
      - charm-2010
      - tw-fob-questions
  - label: "2011-2015"
    text: "CHARM 2011 and 2012, and Lemon Manuals 2013, 2014, and 2015, print
      the same tool-free registration. No Techstream step is on those pages.
      Two 2015 owners wrote that Amazon remotes worked. Their posts do not
      say the remotes were aftermarket."
    sourceIds:
      - charm-2011
      - charm-2012
      - lemon-2013
      - lemon-2014
      - lemon-2015
      - tw-2015-procedure
  - label: "2016 and later"
    text: "This page does not cover these years. My Locksmith Express lists a
      remote-head key, FCC GQ4-52T, for 2016-2023 SR trucks without
      push-button start, and a smart key, FCC HYQ14FBA, for 2016-2021
      push-button trims. That is the shop's fitment table, not a Toyota fiche.
      A Tacoma manual labeled 2015-2018 on ttguide includes a 2GR-FKS smart-key
      start section, and its wireless registration page prints only Techstream.
      Car and Truck Remotes lists an H-chip metal key for 2016-2018 Tacoma."
    sourceIds:
      - mle-tacoma
      - ttguide-2gr
      - ttguide-wireless
      - ctr-key-2016
