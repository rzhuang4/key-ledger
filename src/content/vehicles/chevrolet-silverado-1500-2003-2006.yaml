        years: 2003-2006
        keyTypeNote: 手順のあいだイグニッションキーはシリンダーに入ったままで、別の送信機のボタンを押します。Car and Truck Remotes
          は対応商品を、キーを回して始動するトラック向けキーレスリモコンとして売り、ボタンは Lock、Unlock、Panic
