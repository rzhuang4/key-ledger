# 2005–2015 Toyota Tacoma. Same FCC ID as the 2007–2011 Tundra remote. 2016+ is out of scope.
make: Toyota
makeSlug: toyota
model: Tacoma
modelSlug: tacoma
yearStart: 2005
yearEnd: 2015
yearSlug: "2005-2015"
market: US
title: "2005-2015 Toyota Tacoma keyless remote programming"
description: "Notes for the 2005-2015 Tacoma 3-button remote, FCC GQ43VT20T
  and part 89742-AE011, with owner reports and USD prices. 2016+ is not covered."
summary: "The 2005-2015 Tacoma keyless remote that sellers list is a separate
  3-button fob, FCC GQ43VT20T, part 89742-AE011. A 2006 owner reported an
  aftermarket eBay remote programmed from the seller's instructions. A seller
  says do-it-yourself programming is only for 2004-2010 Tacomas. Some owners
  of 2011 and 2015 trucks report the door sequence worked. A 2015-2018 Toyota
  manual page that was opened prints only Techstream registration."
scope: "Second-generation Tacoma, 2005 through 2015, US market, trucks that
  left the factory with keyless entry and a separate 3-button remote. This page
  does not cover 2016 and later. My Locksmith Express lists those trucks with
  a remote-head key, FCC GQ4-52T, on SR trucks without push-button start, or a
  smart key, FCC HYQ14FBA, on push-button trims. It does not cover a truck that
  was not built with the keyless receiver. A 2015 owner wrote that a dealer and
  later a master mechanic said that truck had no radio hardware for a fob, and
  another 2015 owner wrote that the door sequence needs the factory receiver.
  The remote steps do not program the engine-start chip. A 2009 Tacoma service
  page that was opened is immobilizer registration, and a 2013 owner wrote that
  the key needs a computer."
reviewed: "2026-11-20"
diy:
  status: "yes"
  heroAnswer: "2005-2010: a 2006 owner reported an aftermarket remote programmed from the seller's instructions. 2011-2015: the sources conflict."
  bottomLine: "A 2006 owner reported a $20 aftermarket eBay remote programmed with the seller's instructions. For 2011-2015, KeylessPros says DIY is only for 2004-2010, a Tacoma World member says the fob is self programmable on most 2005-2011 trucks, and some 2011 and 2015 owners report the door sequence worked. A 2015-2018 Toyota manual page prints only Techstream registration."
  heroNotice: "This page does not apply to 2016 and later trucks, to a truck built without factory keyless entry, or to programming the transponder that starts the engine."
  priceCaution: "joes06tacoma, a 2006 owner, wrote that a $20 shipped aftermarket eBay remote from keyless king 'Programmed no problem using his instructions.' TRDSport10 wrote that GQ43VT20T is self programmable on most 2005-2011 Tacomas. Yaozer wrote that an OEM fob worked on a 2011. Hook78 wrote that the posted door sequence worked on a 2015 TRD Off-Road. hoffengineering and 565hunter wrote that Amazon remotes worked on 2015 trucks. KeylessPros says DIY self-programming is only available for 2004-2010 Tacoma. A 2015-2018 Toyota manual page prints Techstream registration and no switch sequence. Chrome wrote that a dealer phone quote was about $202 for a fob and programming. That is one person's report of a quote, not a posted price."
  priceCautionSourceIds:
    - tw-fob-questions
    - tw-2015-procedure
    - amazon-keylesspros
    - tacoma-2015-manual
  summary: "Owner reports and a seller's instruction limit do not say the same
    thing for 2011-2015. The steps below are the sequence a Tacoma World member
    posted for a 2015, not a Toyota service page. The 2015-2018 Toyota page that
    was opened uses Techstream."
  condition: "The posted sequence uses the ignition key. It programs the remote,
    not the chip that starts the engine. KeylessPros says its remote needs one
    working original key that starts the vehicle."
  safetyNote: "A wrong sequence can fail to enter programming mode. Chrome's
    2015 base truck never got the locks to cycle, and a dealer told him the
    truck had no keyless receiver. If the locks do not answer, stop and have a
    locksmith or dealer check whether the truck was built with keyless entry."
  sourceIds:
    - tw-2015-procedure
    - tw-fob-questions
  notes:
    - text: "The numbered steps are the rewrite-mode sequence pheerles posted on
        a 2015 Tacoma World thread. They are not copied from a Toyota manual.
        The 2015-2018 Toyota Tacoma registration page that was opened has only
        a Techstream procedure."
      sourceIds:
        - tw-2015-procedure
        - tacoma-2015-manual
  steps:
    - text: "Start with the key out of the ignition, the driver door open and
        unlocked, and the other doors closed. This wording is the forum post,
        not a Toyota manual."
      sourceIds:
        - tw-2015-procedure
    - text: "Within 5 seconds, insert the key and remove it twice."
      sourceIds:
        - tw-2015-procedure
    - text: "Within 40 seconds, close and open the driver door twice."
      sourceIds:
        - tw-2015-procedure
    - text: "Insert the key and remove it once."
      sourceIds:
        - tw-2015-procedure
    - text: "Within 40 seconds, close and open the driver door twice again."
      sourceIds:
        - tw-2015-procedure
    - text: "Insert the key, close the driver door, and turn the ignition from
        LOCK to ON and back to LOCK twice, about one second apart, for rewrite
        mode. Remove the key. The post says the locks cycle twice if rewrite
        mode was selected."
      sourceIds:
        - tw-2015-procedure
    - text: "Within 40 seconds, press Lock and Unlock together for 1 second,
        then within 3 seconds press Lock. The post says one lock cycle means
        the remote was recognized and two cycles means it was not."
      sourceIds:
        - tw-2015-procedure
    - text: "Repeat that button pair for each other remote, up to four. Opening
        the driver door, inserting the key, waiting 40 seconds, or registering
        four remotes ends the mode."
      sourceIds:
        - tw-2015-procedure
scopeCards:
  - label: "2005-2010"
    text: "KeylessPros says DIY self-programming is available for 2004-2010
      Tacoma. joes06tacoma, a 2006 owner, wrote that a $20 shipped aftermarket
      eBay remote 'Programmed no problem using his instructions.'"
    sourceIds:
      - amazon-keylesspros
      - tw-fob-questions
  - label: "2011-2015"
    text: "These years conflict. KeylessPros says DIY is only for 2004-2010.
      TRDSport10 wrote that GQ43VT20T is self programmable on most 2005-2011
      Tacomas. A 2011 owner wrote that an OEM fob worked. 2015 owners wrote
      that the posted sequence and Amazon remotes worked. A 2015-2018 Toyota
      manual page prints only Techstream. This page does not treat DIY as
      settled for 2011-2015."
    sourceIds:
      - amazon-keylesspros
      - tw-fob-questions
      - tw-2015-procedure
      - tacoma-2015-manual
  - label: "2016 and later"
    text: "This page does not cover these years. My Locksmith Express lists a
      remote-head key, FCC GQ4-52T, for 2016-2023 SR trucks without
      push-button start, and a smart key, FCC HYQ14FBA, for 2016-2021
      push-button trims. That is the shop's fitment table, not a Toyota fiche."
    sourceIds:
      - mle-tacoma
