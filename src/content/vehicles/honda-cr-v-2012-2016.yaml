      - Geprüft am 19. November 2026. Das JSON-LD-Angebot sagte 88,00 Dollar und
        availability https://schema.org/OutOfStock. Dieser Shop ist keiner der
        hier eingetragenen Partnerhändler. Der Preis wird nur zitiert.
      - Ein früherer Aufruf am selben Tag zeigte einen Ab-Preis. Eine neue
        Anfrage am 19. November 2026 lieferte HTTP 429, und es wurde kein
        priceCurrency gelesen. Die Zahl wird nicht gezeigt.
      - Ein Honda-Händlerangebot für einen CR-V-Schlüssel 2012-2016 wurde nicht
        gefunden.
      - Ein veröffentlichter Schlüsseldienstpreis für Schneiden und
        Programmieren eines CR-V-Schlüssels 2012-2016 wurde nicht gefunden. Die
        Serviceseiten beschreiben eine HDS-Arbeit und nennen keine Gebühr.
    shopLabels:
      - 3-Tasten-Fernbedienungsschlüssel von Tom's Key (nennt CR-V 2007-2013)
      - 4-Tasten-CR-V-2014-2016-Schlüssel von Tom's Key
      - 3-Tasten-CR-V-2012-Schlüssel von Car Keys Express
      - Amazon-Suche nach den CR-V-FCC-IDs MLBHLIK-1T und MLBHLIK6-1T
    unverified:
      - Eine einzige Honda-Katalognummer pro Jahr. Für 2012-2013 nennen MK3,
        Tom's Key und Car Keys Express verschiedene Nummern. Für 2014-2016
        stimmen die zwei Händler überein, und eine Honda-Teileliste wurde nicht
