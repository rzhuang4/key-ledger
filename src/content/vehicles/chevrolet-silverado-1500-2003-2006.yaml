    ignitionKeyNote: La page Keysolved du Silverado 1500 1999-2007 décrit la clé de
      contact comme un acier lisse B102 sans puce, et le système comme un GM
      Passlock dans le module de carrosserie, pas comme un transpondeur dans la
      clé. Elle dit que cela couvre tous les pick-up 1999-2006 et le Classic
      2007. La même page liste une télécommande séparée à 3 boutons, FCC LHJ011,
      pour 2003-2006 et le Classic 2007. Cela n’ajoute pas d’étapes pour tailler
      cette lame.
    troubleshooting:
      - id: no-cycle
        title: Les serrures ne cyclent pas du tout
        text: La page de programmation North Coast Keyless du Silverado 2005 dit que si
          les serrures ne cyclent jamais, la clé tourne peut-être trop vite ou
          trop lentement, le système keyless a un problème, ou le pick-up n’a
          pas de keyless. Elle dit de vérifier avec un serrurier ou un
          concessionnaire. Les pages d’atelier GM ouvertes disent que les
          serrures doivent cycler quand on relâche l’interrupteur de
          déverrouillage. Elles n’impriment pas cette distinction.
      - id: early-cycle
        title: Les serrures cyclent avant de relâcher l’interrupteur
        text: La même page North Coast dit qu’un cycle avant de relâcher le bouton de
          déverrouillage signifie que le pick-up n’est pas entré en mode
          programmation et qu’il faut recommencer. Si les serrures continuent de
          cycler avant le relâchement, cette page dit que le système keyless a
          un problème et qu’un serrurier ou un concessionnaire doit programmer
          les télécommandes. Les pages d’atelier GM ouvertes n’impriment pas ce
          test de cycle trop tôt.
      - id: no-response
        title: Pas de seconde réponse de la télécommande
        text: North Coast dit de maintenir Lock et Unlock ensemble jusqu’à 30 secondes,
          jusqu’à ce que les serrures cyclent encore. Les pages d’atelier GM
          ouvertes disent que cette confirmation arrive après environ 15
          secondes. Aucune des deux ne donne un test séparé pour une
          télécommande qui reste silencieuse après que les serrures ont déjà
          cyclé pour confirmer le mode. Ce cas est inconnu ici.
