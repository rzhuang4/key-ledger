  ja:
    title: 2011-2014 Ford F-150 のリモコン一体キー登録
    description: 2011-2014 F-150 のリモコン一体キーを、動くキー 2 本で登録するメモ。FCC ID CWTWB1U793、部品番号、出典が食い違う点。
    summary: 2013 年 F-150 の取扱説明書は、登録済みキーが 2 本あれば一体型キーヘッド送信機を自分で登録できると書いています。Ford
      の現行手順ページは同じ種類のキーを説明しますが、押す時間が違います。2013
      年トラックの部品販売店は車内登録は無いとしています。その食い違いは下に書いてあります。
    scope: 刃の付いた一体型キーヘッド送信機を使う 2011-2014 Ford F-150 です。FCC ID CWTWB1U793 の 3
      ボタンリモコン一体キーとして売られることが多いです。下の押す時間は 2013 年取扱説明書の転記で、2011、2012、2014
      年の本ではありません。プッシュボタンの Intelligent Access キーは扱いません。
    diy:
      summary: 一体型キーヘッド送信機は、動くコードキーが 2 本あるときに車内登録が公開されています。その 2 本が無いとき、2013 年の転記も Ford
        の手順ページもディーラーへ向かわせます。
      condition: 以前登録したコードキー 2 本と、未登録の一体型キーヘッド送信機または SecuriLock キーが 1
        本必要です。刃は別途カットが必要です。Car and Truck Remotes は販売するリモコンをカットも登録もしないと書いています。
      safetyNote: このページの出典で、押す時間が一致しません。順番を誤ると新しいキーが登録されないことがあります。動くキーが 2
        本無いときは車内の方法は使えず、ディーラーか鍵屋が必要です。慎重に 1 回やって失敗したら止め、鍵屋かディーラーに仕上げてもらってください。
      notes:
        - text: 2013 年の転記は、この手順がエンジンのイモビライザー符号とリモコンのボタンの両方を登録し、一体型キーヘッド送信機か標準の SecuriLock
            キーにしか使えないと書いています。コードキーは最大 8 本で、そのうち一体型キーヘッド送信機は 4 本までです。
        - text: "Car and Truck Remotes の 2013 F-150 掲載は「On Board Programming:
            No」とし、リモコンは鍵屋が専門にカットし登録する必要があると書いています。これは取扱説明書の転記と Ford
            の手順ページと矛盾します。販売店は、ディーラーが社外リモコンの登録を断ることがあるとも書いています。"
      steps:
        - text: 以前登録したコードキー 2 本と、未登録の新しいキーを手の届くところに置きます。始める前に手順全体を読んでください。文言は Auto Guide
            Galaxy が転記した 2013 F-150 Owner's Guide 第 1 刷に従います。当サイトは Ford の元 PDF
            を開いていません。
        - text: 1 本目の登録済みキーを差し込みます。イグニッションを off から on にし、3 秒以上 10 秒以内とどめてから off にして抜きます。
        - text: 1 本目を抜いてから 3 秒後、ただし 10 秒以内に、2 本目の登録済みキーを差し込みます。on を 1 秒以上 10 秒以内にしてから off
            にして抜きます。
        - text: 2 本目を抜いてから 3 秒後、ただし 10 秒以内に、未登録の新しいキーを差し込みます。on を 1 秒以上 10 秒以内にしてから抜きます。
        - text: 成功すれば新しいキーでエンジンがかかります。一体型キーヘッド送信機ならリモコン解錠も動きます。失敗したとき、転記は 20
            秒待って繰り返し、そのあと正規ディーラーへ運ぶと書いています。
