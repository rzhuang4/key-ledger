i18n:
  zh-hant:
    title: 2011-2014 Ford F-150 遙控頭鑰匙編程
    description: 2011-2014 F-150 遙控頭鑰匙的兩把鑰匙編程筆記，FCC ID CWTWB1U793、零件號，以及出處彼此不一致的地方。
    summary: 2013 F-150 車主手冊說，如果已經有兩把編過程的鑰匙，車主可以自己編程一體式鑰匙頭發射器。Ford
      目前的操作說明頁描述同一類鑰匙，但按住時間不同。2013 年貨車的零件賣家說沒有車上編程。下面把這些不一致寫清楚。
    scope: 使用帶齒片的一體式鑰匙頭發射器的 2011-2014 Ford F-150，常被當成 FCC ID CWTWB1U793 的 3
      鍵遙控頭鑰匙出售。下面的按住時間來自 2013 車主手冊的轉寫，不是 2011、2012 或 2014 的書。按鈕啟動的 Intelligent
      Access 鑰匙不在本頁。
    diy:
      summary: 一體式鑰匙頭發射器在已經有兩把可用的編碼鑰匙時，有公開的車上編程。沒有那兩把鑰匙時，2013 手冊轉寫和 Ford 的操作頁都要你去經銷商。
      condition: 需要兩把先前編過程的編碼鑰匙，以及一把尚未編程的一體式鑰匙頭發射器或 SecuriLock 鑰匙。齒片仍須切削。Car and Truck
        Remotes 說他們不切削也不編程所售的遙控器。
      safetyNote: 本頁出處的按住時間不一致。順序錯了可能讓新鑰匙編不進去。如果還沒有兩把能用的鑰匙，車上方法不適用，需要經銷商或鎖匠。小心試一次仍失敗就停下來，讓鎖匠或經銷商把工作做完。
      notes:
        - text: 2013 轉寫說這個程序同時編程引擎防盜碼和遙控按鈕，而且只適用於一體式鑰匙頭發射器或標準 SecuriLock
            鑰匙。最多八把編碼鑰匙，其中最多四把可以是一體式鑰匙頭發射器。
        - text: "Car and Truck Remotes 的 2013 F-150 商品頁寫「On Board Programming:
            No」，並說遙控器必須由鎖匠專業切削和編程。這和車主手冊轉寫以及 Ford 的操作頁相反。賣家還說經銷商可能拒絕編程售後遙控器。"
      steps:
        - text: 把兩把先前編過程的編碼鑰匙和一把尚未編程的新鑰匙放在手邊。開始前先讀完整個順序。用詞依 Auto Guide Galaxy 轉寫的 2013
            F-150 Owner's Guide 第 1 刷。本站沒有打開 Ford 的原始 PDF。
        - text: 插入第一把已編程的鑰匙。把點火從 off 轉到 on，停留至少 3 秒、不超過 10 秒。轉回 off 並取出鑰匙。
        - text: 取出第一把鑰匙後過 3 秒、但在 10 秒內，插入第二把已編程的鑰匙。點火轉到 on，至少 1 秒、不超過 10 秒。轉回 off 並取出。
        - text: 取出第二把鑰匙後過 3 秒、但在 10 秒內，插入尚未編程的新鑰匙。點火轉到 on，至少 1 秒、不超過 10 秒，然後取出。
        - text: 如果成功，新鑰匙能發動引擎。如果它是一體式鑰匙頭發射器，也能操作遙控開門。如果失敗，轉寫說等 20 秒再重複，然後把貨車送到授權經銷商。
    comparisons:
      caption: 不要在同一次嘗試裡混用這些按住時間。左欄是 2013 貨車手冊轉寫。右欄是 Ford 目前的一般操作說明，沒有指名 F-150。
