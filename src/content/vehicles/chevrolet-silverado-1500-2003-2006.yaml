        note: 기본 JSON-LD는 37.00 CAD라 표시하지 않습니다. currency=USD JSON-LD는 30.00 USD,
          InStock, 변형 하나. SKU SAP-Tahoe-Complete-(2)는 여러 개 묶음으로 설명되지 않습니다.
      - id: keysolved-1999-2007
        title: Chevrolet Silverado 1500 1999-2007 키 자료
        publisher: Keysolved
        note: 1999-2006과 2007 Classic의 점화 키를 칩 없는 강철 B102, GM Passlock으로 적고, LHJ011 리모컨을
          2003-2006과 2007 Classic의 별도 부품으로 적습니다.
    ignitionKeyNote: Keysolved의 1999-2007 Silverado 1500 페이지는 점화 키를 칩이 없는 강철 B102로
      적고, 방식은 키 안의 트랜스폰더가 아니라 차체 제어 모듈의 GM Passlock이라고 합니다. 1999-2006 전 트럭과 2007
      Classic에 해당한다고 합니다. 같은 페이지는 FCC LHJ011 3버튼 별도 리모컨을 2003-2006과 2007
      Classic에 적습니다. 이 톱니를 깎는 단계는 더하지 않습니다.
    troubleshooting:
      - id: no-cycle
        title: 잠금이 전혀 순환하지 않음
        text: North Coast Keyless의 2005 Silverado 프로그래밍 페이지는 잠금이 전혀 순환하지 않으면 키를 너무 빨리 또는
          너무 느리게 돌렸거나, 키리스 시스템에 문제가 있거나, 키리스가 없는 차일 수 있다고 합니다. 열쇠 기술자나 딜러에게
          확인하라고 합니다. 연 GM 정비 페이지는 열림 스위치를 놓으면 잠금이 순환해야 한다고만 하고, 이 구분은 적지 않습니다.
      - id: early-cycle
        title: 열림 스위치를 놓기 전에 잠금이 순환함
        text: 같은 North Coast 페이지는 열림 버튼을 놓기 전에 순환하면 프로그래밍 모드에 들어가지 않은 것이니 처음부터 다시 하라고
          합니다. 놓기 전에 계속 순환하면 키리스 시스템에 문제가 있어 열쇠 기술자나 딜러가 프로그래밍해야 한다고 합니다. 연 GM
          정비 페이지에는 이 이른 순환 테스트가 없습니다.
      - id: no-response
        title: 리모컨의 두 번째 응답이 없음
        text: North Coast는 Lock과 Unlock을 최대 30초, 잠금이 다시 순환할 때까지 누르라고 합니다. 연 GM 정비 페이지는 그
          확인이 약 15초 뒤라고 합니다. 둘 다, 프로그래밍 모드가 확인된 뒤에도 리모컨이 계속 무반응인 경우를 위한 별도 테스트는
          주지 않습니다. 그 경우는 여기서 미상입니다.
  es:
    title: Programación del mando del Chevrolet Silverado 1500 2003-2006
    description: Pasos a bordo del mando keyless del Silverado 1500 2003-2006, con
      ID FCC LHJ011, números de pieza, pila y precios citados.
    summary: El mando keyless de un Chevrolet Silverado 1500 2003-2006 se programa
      en el encendido, sin escáner. La hoja de la pieza 21997127 nombra esa
      camioneta e imprime la secuencia. El mando va aparte; no es la llave
      metálica de encendido.
    scope: Silverado 1500 ligera, de 2003 a 2006, mercado de EE. UU. La misma hoja
      también nombra la Silverado 1500 2007 y varios HD. Esos quedan fuera de
      esta página. Una camioneta sin keyless de fábrica no tiene receptor al que
      hable este mando.
    diy:
      summary: Programe en la misma sesión cada mando que quiera conservar. La hoja
        dice que los transmisores ya guardados se borran cuando se acepta el
        primero nuevo. Esta secuencia programa solo el mando keyless.
      condition: Hace falta un mando compatible y la llave de encendido que gira el
        cilindro. Esto no talla una llave de metal.
      safetyNote: La hoja dice que el primer mando aceptado en esta sesión borra los
        que la camioneta ya conoce. Una secuencia incorrecta puede borrar mandos
        que funcionan o no entrar en modo de programación. Si las puertas no se
        cierran y abren para confirmar el modo, deténgase. Un cerrajero o el
        concesionario pueden terminar el trabajo.
      notes:
        - text: El propio encabezado de la hoja es la pieza 21997127 e incluye la
            Chevrolet Silverado 1500 2003-2007 entre los vehículos que pueden
            usar la secuencia impresa. Pide escáner a los dueños de Equinox
            2005-2006, Torrent 2006 y Vue 2002-2003. Esas excepciones no son
            esta camioneta.
      steps:
        - text: Cierre todas las puertas.
        - text: Inserte la llave de encendido en el cilindro de la cerradura de encendido.
        - text: Mantenga pulsado el interruptor de desbloqueo de la puerta.
        - text: Mientras sostiene ese interruptor en desbloqueo, gire el encendido a ON,
            OFF, ON, OFF.
        - text: Suelte el interruptor de desbloqueo. Las puertas se cierran y se abren una
            vez para confirmar que la camioneta está en modo de programación.
        - text: En un mando, mantenga Lock y Unlock a la vez hasta que las puertas vuelvan
            a cerrarse y abrirse. La hoja de instrucciones y los procedimientos
            de servicio de GM abiertos aquí dicen que esa confirmación llega
            tras unos 15 segundos. La página de programación de North Coast
            Keyless para esta camioneta dice que la misma pulsación puede tardar
            hasta 30 segundos.
        - text: Repita la pulsación de Lock y Unlock para cada mando que quiera conservar,
            hasta cuatro, en la misma sesión.
        - text: Gire el encendido a RUN para salir del modo de programación y pruebe
            bloqueo, desbloqueo y Panic en cada mando.
    variants:
      - id: lhj011-3-button
        name: Mando keyless de 3 botones
        years: 2003-2006
        keyTypeNote: Durante el procedimiento la llave de encendido permanece en el
          cilindro y usted pulsa un transmisor aparte. Car and Truck Remotes
