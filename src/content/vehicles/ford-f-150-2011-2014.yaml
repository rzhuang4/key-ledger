    priceNotes:
      - "Vérifié le 19 novembre 2026 dans le JSON Shopify, pas dans l’étiquette
        du thème. Le F-150 2013 a renvoyé available: true, 29,95 dollars et prix
        barré 180. Le texte Sold out est une étiquette cachée du thème. Ils ne
        taillent ni ne programment et disent qu’un serrurier doit faire les
        deux. Le montant est le matériel seul."
      - Aucun devis pièces et main-d’œuvre de concession Ford pour une clé de
        F-150 2011-2014 n’a été trouvé. Le guide dit d’aller chez un
        concessionnaire agréé sans deux clés programmées et n’imprime pas de
        prix.
      - Le vendeur dit de demander au serrurier la taille et la programmation et
        ne publie pas ce prix de main-d’œuvre. Aucune liste séparée de prix de
