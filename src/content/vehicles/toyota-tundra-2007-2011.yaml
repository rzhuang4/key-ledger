troubleshooting:
  - id: no-mode-answer
    title: "The locks do not answer after the ignition count"
    text: "The 2007 figure and the service text say zero, four, or six or more
      ON-to-OFF cycles get no lock response. The count has to be one, two,
      three, or five, about one second apart, and the earlier door and key steps
      have to stay inside their time limits."
    sourceIds:
      - tundra-2007
  - id: two-cycles
    title: "The locks cycle twice after the remote button"
    text: "Two lock-unlock cycles mean that remote was not stored. The pages say
      to start the whole sequence again. One cycle means it was stored."
    sourceIds:
      - tundra-2007
  - id: rewrite-erases
    title: "A working remote stopped working"
    text: "Rewrite mode erases every code already stored. Add mode erases the
      oldest code once the truck is asked to hold more than four. Program every
      remote you want to keep in the same session."
    sourceIds:
      - tundra-2007
      - tundra-2009
ignitionKey:
  status: verified
  blade: TR47
  transponder: present
  sourceIds:
    - mykey-toy44d
    - ctr-toy44
  note: "Check the key head. My Key Supply lists a TOY44D transponder key, chip
    4D67, blade TR47, for Tundra 2007-2009, with no remote buttons. Car and
    Truck Remotes says a 2010 Tundra was issued two keys. A dot on the head is
    the Texas 4D 67 chip they call the Dot chip, Ilco TOY44D-PT, test key TR47,
    listed for Tundra 2007-2010. A letter G on the head is the key they call
    the G chip, Ilco TOY44G-PT, test key TR47, and they also print Texas 4D 67
    for that G chip. They list the G key for Tundra 2010-2017, which includes
    2011. Both of their 2010 lines say to verify, because a 2010 truck may have
    either stamp. Cutting the blade is not enough to start the engine. Car and
    Truck Remotes says a locksmith has to cut and program this key."
