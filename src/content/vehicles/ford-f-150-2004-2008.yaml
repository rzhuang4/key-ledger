    text: "Not this page. Car and Truck Remotes lists the same remote shape
      through 2010 F-150, but the Ford parts line used here stops at new-style
      2008, and no 2009 or 2010 Ford procedure was opened. The 2011-2014
      integrated key has its own page."
    sourceIds:
      - ctr-f150
      - ford-parts-8l3z
