  es:
    title: Programación y números de pieza de la Honda CR-V 2012-2016
    description: Las llaves con inmovilizador de la Honda CR-V 2012-2016 necesitan
      una herramienta de diagnóstico. ID FCC, números de pieza, pilas y precios
      de vendedores, cada uno con fuente.
    summary: Las páginas de servicio de Honda para la CR-V 2012-2016 dicen que hace
      falta el sistema de diagnóstico Honda (HDS) para registrar una llave con
      inmovilizador, y que el mismo trabajo programa el transmisor keyless. Esta
      página no da una secuencia de botones a bordo. En las fichas aparecen dos
      llaves con mando distintas, y los vendedores no coinciden en un solo
      número de pieza para 2012-2013.
    scope: CR-V de cuarta generación, años 2012 a 2016, mercado de EE. UU., llaves
      con mando y hoja. Los vendedores de abajo excluyen las llaves inteligentes
      de botón, y esta página no les asigna un ID FCC propio. Una llave de 2012
      y una de 2015 no se tratan como la misma pieza.
    diy:
      summary: Un procedimiento de servicio del CR-V LX 2012 y una reimpresión de
        servicio del CR-V 2012-2016 dicen que el HDS es necesario para registrar
        llaves con inmovilizador. Programar el inmovilizador también programa el
        transmisor keyless. La unidad guarda hasta seis llaves. En el texto del
        LX 2012, añadir una llave exige una ya registrada y la primera
        contraseña del sistema iN de Honda. Si se pierden todas, ese texto pide
        el código PCM del inmovilizador. Son pasos de taller. Aquí no se
        reimprimen como algo para probar en la entrada.
      condition: Tom's Key vende un programador aparte y dice que hace falta al menos
        una llave que funcione para usarlo. Sigue siendo una herramienta, no
        programación a bordo. Car Keys Express dice que la hoja debe cortarse.
      safetyNote: En esta página no hay secuencia a bordo. Adivinar ciclos de
        encendido o combinaciones de botones puede dejar una llave no
        reconocida, y entonces un cerrajero o un concesionario Honda tiene que
        recuperarla con la herramienta correcta. Deténgase si no tiene esa
        herramienta ni la contraseña o el código de inmovilizador que usa el
        procedimiento.
    variants:
