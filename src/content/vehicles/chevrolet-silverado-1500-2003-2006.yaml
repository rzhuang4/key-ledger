      llave de contacto como un acero liso B102 sin chip, y el sistema como GM
      Passlock en el módulo de carrocería, no como un transpondedor en la llave.
      Dice que cubre todas las camionetas 1999-2006 y la Classic 2007. La misma
      página lista un mando keyless separado de 3 botones, FCC LHJ011, para
      2003-2006 y la Classic 2007. Esto no añade pasos para tallar esa espada.
    troubleshooting:
      - id: no-cycle
        title: Las cerraduras no ciclan en absoluto
        text: La página de programación de North Coast Keyless para el Silverado 2005
          dice que si las cerraduras no ciclan nunca, puede estar girando la
          llave demasiado rápido o demasiado lento, el sistema keyless puede
          tener un fallo, o la camioneta puede no tener keyless. Dice que
          consulte a un cerrajero o a un concesionario. Las páginas de servicio
          de GM abiertas dicen que las cerraduras deben ciclar al soltar el
          interruptor de apertura. No imprimen esta división.
      - id: early-cycle
        title: Las cerraduras ciclan antes de soltar el interruptor
        text: La misma página de North Coast dice que un ciclo antes de soltar el botón
          de apertura significa que la camioneta no entró en modo de
          programación y hay que empezar de nuevo. Si las cerraduras siguen
          ciclando antes de soltar el botón, esa página dice que el sistema
          keyless tiene un problema y que un cerrajero o un concesionario debe
          programar los mandos. Las páginas de servicio de GM abiertas no
          imprimen esa prueba de ciclo temprano.
      - id: no-response
        title: El mando no da una segunda respuesta
        text: North Coast dice mantener Lock y Unlock juntos hasta 30 segundos, hasta
          que las cerraduras ciclen otra vez. Las páginas de servicio de GM
          abiertas dicen que esa confirmación llega tras unos 15 segundos.
          Ninguna de las dos da una prueba aparte para un mando que sigue en
          silencio después de que las cerraduras ya ciclaron para confirmar el
          modo. Ese caso es desconocido aquí.
  pt-br:
    title: Programação do controle do Chevrolet Silverado 1500 2003-2006
    description: Passos a bordo do controle keyless da Silverado 1500 2003-2006, com
      ID FCC LHJ011, números de peça, pilha e preços citados.
    summary: O controle keyless de uma Chevrolet Silverado 1500 2003-2006 se
      programa na ignição, sem scanner. A folha da peça 21997127 cita essa
      picape e imprime a sequência. O controle é separado; não é a chave
      metálica da ignição.
    scope: Silverado 1500 leve, de 2003 a 2006, mercado dos EUA. A mesma folha
      também cita a Silverado 1500 2007 e vários HD. Esses ficam fora desta
      página. Uma picape sem keyless de fábrica não tem receptor para este
      controle.
    diy:
      summary: Programe na mesma sessão cada controle que quiser manter. A folha diz
        que os transmissores já gravados são apagados quando o primeiro novo é
        aceito. Esta sequência programa só o controle keyless.
      condition: É preciso um controle compatível e a chave de ignição que gira o
        cilindro. Isto não corta uma chave de metal.
      safetyNote: A folha diz que o primeiro controle aceito nesta sessão apaga os que
        a picape já conhece. Uma sequência errada pode apagar controles que
        funcionam ou não entrar no modo de programação. Se as portas não
        travarem e destravarem para confirmar o modo, pare. Um chaveiro ou a
        concessionária podem terminar o serviço.
      notes:
        - text: O próprio cabeçalho da folha é a peça 21997127 e inclui a Chevrolet
            Silverado 1500 2003-2007 entre os veículos que podem usar a
            sequência impressa. Pede scanner aos donos de Equinox 2005-2006,
            Torrent 2006 e Vue 2002-2003. Essas exceções não são esta picape.
      steps:
        - text: Feche todas as portas.
        - text: Insira a chave de ignição no cilindro da trava de ignição.
        - text: Mantenha pressionado o interruptor de destravamento da porta.
        - text: Enquanto segura esse interruptor em destravar, gire a ignição para ON,
            OFF, ON, OFF.
        - text: Solte o interruptor de destravamento. As portas travam e destravam uma vez
            para confirmar que a picape entrou no modo de programação.
        - text: Em um controle, mantenha Lock e Unlock juntos até as portas travarem e
            destravarem de novo. A folha de instruções e os procedimentos de
            serviço da GM abertos aqui dizem que essa confirmação chega após
            cerca de 15 segundos. A página de programação da North Coast Keyless
            para esta picape diz que a mesma pressão pode levar até 30 segundos.
        - text: Repita segurar Lock e Unlock para cada controle que quiser manter, até
            quatro, na mesma sessão.
        - text: Gire a ignição para RUN para sair do modo de programação e teste travar,
            destravar e Panic em cada controle.
    variants:
