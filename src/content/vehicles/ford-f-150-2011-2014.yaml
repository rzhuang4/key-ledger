  pt-br:
    title: Programação da chave com controle da Ford F-150 2011-2014
    description: Notas de programação com duas chaves para a chave com controle da
      F-150 2011-2014, ID FCC CWTWB1U793, números de peça e onde as fontes
      divergem.
    summary: O guia do proprietário da F-150 2013 diz que você pode programar o
      próprio transmissor de cabeça integrada se já tiver duas chaves
      programadas. A página atual da Ford descreve o mesmo tipo de chave e usa
      outros tempos de pressão. Um vendedor de peças da picape 2013 diz que não
      há programação a bordo. Essas diferenças estão abaixo.
    scope: Picapes Ford F-150 2011-2014 com transmissor de cabeça integrada e
      lâmina, muitas vezes vendidas como chave com controle de 3 botões e ID FCC
      CWTWB1U793. Os tempos abaixo vêm de uma transcrição do guia de 2013, não
      dos livros de 2011, 2012 ou 2014. Chaves Intelligent Access de botão não
      estão cobertas.
    diy:
      summary: Há programação a bordo publicada para um transmissor de cabeça
        integrada quando duas chaves codificadas já funcionam. Sem essas duas, a
        transcrição de 2013 e a página da Ford mandam você à concessionária.
      condition: São necessárias duas chaves codificadas já programadas e um
        transmissor de cabeça integrada ou uma chave SecuriLock novos, sem
        programar. A lâmina ainda precisa ser cortada. A Car and Truck Remotes
        diz que não corta nem programa o controle que vende.
      safetyNote: Os tempos de pressão não batem entre as fontes desta página. Uma
        sequência errada pode deixar a chave nova sem programar. Se você ainda
        não tem duas chaves que funcionem, o método a bordo não se aplica e é
        preciso concessionária ou chaveiro. Se uma tentativa cuidadosa falhar,
        pare e deixe um chaveiro ou a concessionária terminarem.
      notes:
        - text: A transcrição de 2013 diz que o procedimento programa o código do
            imobilizador do motor e os botões do controle, e que só vale para
            transmissores de cabeça integrada ou chaves SecuriLock comuns.
            Admite no máximo oito chaves codificadas, e só quatro dessas oito
            podem ser transmissores de cabeça integrada.
        - text: "A ficha da Car and Truck Remotes da F-150 2013 diz “On Board Programming:
            No” e que um chaveiro deve cortar e programar o controle de forma
            profissional. Isso contradiz a transcrição do guia e a página da
            Ford. O vendedor também diz que uma concessionária pode recusar
            programar um controle de reposição."
      steps:
        - text: Tenha à mão duas chaves codificadas já programadas e a chave nova sem
            programar. Leia a sequência inteira antes de começar. O texto segue
            o Owner's Guide da F-150 2013, 1.ª impressão, transcrito pela Auto
            Guide Galaxy. Este site não abriu o PDF original da Ford.
        - text: Insira a primeira chave programada. Gire a ignição de off para on e deixe
            pelo menos 3 segundos e no máximo 10. Volte a off e retire a chave.
        - text: Depois de 3 segundos, mas dentro de 10 segundos de tirar a primeira chave,
            insira a segunda chave programada. Deixe a ignição em on pelo menos
            1 segundo e no máximo 10. Volte a off e retire-a.
        - text: Depois de 3 segundos, mas dentro de 10 segundos de tirar a segunda chave,
            insira a chave nova sem programar. Ignição em on pelo menos 1
            segundo e no máximo 10, depois retire-a.
        - text: Se funcionou, a chave nova dá partida no motor. Se for um transmissor de
            cabeça integrada, também opera a entrada remota. Se falhou, a
            transcrição diz esperar 20 segundos e repetir, e depois levar a
            picape a uma concessionária autorizada.
    comparisons:
      caption: Não misture esses tempos na mesma tentativa. A coluna da esquerda é a
        transcrição do manual de 2013. A da direita é o guia geral atual da
        Ford, que não cita a F-150.
      columns:
        - heading: Transcrição do guia de 2013
        - heading: Guia da Ford.com (sem ano do modelo)
      rows:
        - action: Primeira chave programada em on
          values:
            - Pelo menos 3 segundos, no máximo 10
            - Pelo menos 3 segundos, no máximo 10
        - action: Espera antes da segunda chave
          values:
            - Depois de 3 segundos, mas dentro de 10 segundos de tirar a
              primeira chave
            - Depois de 3 segundos, mas dentro de 10 segundos de pôr a ignição
              em off
        - action: Segunda chave programada em on
          values:
            - Pelo menos 1 segundo, no máximo 10
            - Pelo menos 3 segundos, no máximo 10
        - action: Espera antes da chave nova
          values:
            - Depois de 3 segundos, mas dentro de 10 segundos de tirar a segunda
              chave
            - Depois de 3 segundos, mas dentro de 20 segundos de pôr a ignição
              em off e tirar a segunda chave
        - action: Chave nova em on
          values:
            - Pelo menos 1 segundo, no máximo 10
            - Pelo menos 6 segundos
