yearEnd: 2016
yearSlug: "2012-2016"
market: US
title: "2012-2016 Honda CR-V key programming and part numbers"
description: "2012-2016 Honda CR-V immobilizer keys need a scan tool. FCC IDs,
  part numbers, batteries, and seller prices, each with a source."
summary: "Honda service pages for the 2012-2016 CR-V say a Honda Diagnostic
  System (HDS) scan tool is required to register an immobilizer key, and that
  the same job programs the keyless transmitter. Owners do not get an on-board
  button sequence on this page. Two different remote-head keys show up in parts
  listings, and the sellers do not agree on a single part number for 2012-2013."
scope: "Fourth-generation CR-V, model years 2012 through 2016, US market,
  remote-head keys with a blade. Push-button smart keys are excluded by the
  sellers below and were not given their own FCC ID on this page. A 2012 key and
  a 2015 key are not treated as the same part."
reviewed: "2026-11-19"
diy:
  status: "needs-tool"
  summary: "A 2012 CR-V LX service procedure and a 2012-2016 CR-V service reprint
    both say the HDS is required to register immobilizer keys. Programming the
    immobilizer also programs the keyless transmitter. The control unit stores
    up to six immobilizer keys. Adding a key, in the 2012 LX text, takes a key
    that is already registered plus the first password from Honda's iN system.
    If every key is lost, that text calls for the immobilizer PCM code. Those
    are shop steps. They are not reprinted here as something to try in a
    driveway."
  condition: "Tom's Key sells a separate programmer and says at least one working
    key is required to use it. That is still a tool, not on-board programming.
    Car Keys Express tells you the blade has to be cut."
  safetyNote: "There is no on-board sequence on this page. Guessing ignition
    cycles or button combinations can leave a key unrecognized, and a locksmith
    or Honda dealer then has to recover it with the right tool. Stop if you do
    not have that tool and the password or immobilizer code the service
    procedure uses."
  sourceIds:
    - honda-2012-lx
    - honda-2012-2016
    - toms-3btn
    - cke-2012
variants:
  - id: remote-head-2012-2013
    name: "3-button remote-head key"
    years: "Listed by sellers for 2012-2013, and by some for 2007-2013"
    yearStart: 2012
    yearEnd: 2013
    fitment: "Fits 2007-2013"
    keyType: remote-head-key
    keyTypeNote: "Car Keys Express calls this a remote and key combo, also known as
      a remote-head key: an ignition key with a transponder plus Lock, Unlock,
      and Panic. Tom's Key sells the same kind of 3-button key and says it will
      not work on a push-button start."
    keyTypeSourceIds:
      - cke-2012
      - toms-3btn
    fccIds:
      - id: MLBHLIK-1T
        role: oem
        note: "FCC grant to Honda Lock Mfg. Co., Ltd., model HLIK-1T, remote keyless
          entry transmitter. Grant date May 9, 2006. Frequency on the grant is
          313.85 MHz. Car Keys Express, Tom's Key, and MK3 all print MLBHLIK-1T
          on CR-V remote-head listings."
        sourceIds:
          - fcc-mlbhlik-1t
          - cke-2012
          - toms-3btn
          - mk3-2012
    oemPartNumbers:
      - number: "35111-SWA-306"
        summary: true
        note: "Tom's Key lists this as the part its 3-button aftermarket key replaces.
          The listing covers CR-V 2007-2013 and other Honda models, not only
          2012-2013."
        sourceIds:
          - toms-3btn
      - number: "35118-T0A-A00"
        note: "MK3 lists this as the OEM part for a 2012-2013 CR-V remote. The US
          sellers checked below print different numbers. Not confirmed on a
          Honda parts fiche. The MK3 price is excluded, and this number is not
          used in the year summary."
        sourceIds:
          - mk3-2012
      - number: "HLIK-1T"
        note: "Car Keys Express lists HLIK-1T as a part number. That string is also the
          FCC model. Treat it as the seller's label, not as proof it is the
          Honda parts-counter number."
        sourceIds:
          - cke-2012
      - number: "5938192"
        note: "Strattec number printed by Car Keys Express."
        sourceIds:
          - cke-2012
    battery:
      status: verified
      type: CR1616
      note: "MK3 states CR1616. The FCC grant does not name the cell. The Tom's Key
        and Car Keys Express pages checked for this key do not list a battery."
      sourceIds:
        - mk3-2012
    frequency:
      status: verified
      text: "313.85 MHz"
      note: "That is the grant frequency. MK3's product page says 315 MHz for the same
        FCC ID. Use the number on the grant, and match the ID on your key rather
        than a rounded seller frequency."
      sourceIds:
        - fcc-mlbhlik-1t
        - mk3-2012
    sellerClaims:
      - text: "Tom's Key lists the chip as Philips 46. MK3 lists transponder ID
          PCF7961A. Those claims were not checked against a Honda document, and
          they are not the same label."
        sourceIds:
          - toms-3btn
          - mk3-2012
      - text: "Tom's Key also prints 'MLBHL1K-1T' next to MLBHLIK-1T. The extra spelling
          does not match the FCC grant. Read the ID on your key character by
          character."
        sourceIds:
          - toms-3btn
    buttons:
      count: 3
      sourceIds:
        - cke-2012
  - id: remote-head-2014-2016
    name: "4-button remote-head key"
    years: "2014-2016"
    yearStart: 2014
    yearEnd: 2016
    keyType: remote-head-key
    keyTypeNote: "Tom's Key and Keys4Less both sell a 4-button remote-head key for
      the 2014-2016 CR-V, with lock, unlock, panic, and a hatch or trunk
      release. Both say the FCC ID is MLBHLIK6-1T. Tom's Key says it will not
      work on push-button start. Keys4Less categorizes it as a remote head key."
    keyTypeSourceIds:
      - toms-4btn
      - keys4less-2014
    fccIds:
      - id: MLBHLIK6-1T
        role: oem
        note: "FCC grant to Honda Lock Mfg. Co., Ltd., model HLIK6-1T, keyless-entry
          transmitter. Grant date February 6, 2012. Frequency on the grant is
          313.85 MHz. Keys4Less also prints MLBHLIK61T without a hyphen; the
          grant uses MLBHLIK6-1T."
        sourceIds:
          - fcc-mlbhlik6-1t
          - toms-4btn
          - keys4less-2014
    oemPartNumbers:
      - number: "35118-T7S-A00"
        note: "Printed by both Tom's Key and Keys4Less. Not confirmed on a Honda parts
          fiche. Keys4Less also prints the unhyphenated form 35118T7SA00."
        sourceIds:
          - toms-4btn
          - keys4less-2014
      - number: "35118-T0A-A30"
        note: "Printed by both Tom's Key and Keys4Less. Keys4Less also prints
          35118T0AA30."
        sourceIds:
          - toms-4btn
          - keys4less-2014
    battery:
      status: verified
      type: CR1620
      note: "Keys4Less states CR1620. Tom's Key's 2014-2016 page does not list a
        battery. The FCC grant does not name the cell."
      sourceIds:
        - keys4less-2014
    frequency:
      status: verified
      text: "313.85 MHz"
      note: "Grant frequency. Keys4Less says 314 MHz. Tom's Key's page does not state
        a frequency."
      sourceIds:
        - fcc-mlbhlik6-1t
        - keys4less-2014
    sellerClaims:
      - text: "Tom's Key lists the transponder as Philips 47. That was not checked
          against a Honda document."
        sourceIds:
          - toms-4btn
    buttons:
      count: 4
      sourceIds:
        - toms-4btn
