    troubleshooting:
      - id: no-cycle
        title: Die Schlösser schalten gar nicht
        text: "Die Programmierseite von North Coast Keyless zum Silverado 2005 sagt:
          Wenn die Schlösser nie schalten, dreht man den Schlüssel vielleicht zu
          schnell oder zu langsam, die Keyless-Anlage hat ein Problem, oder der
          Truck hat kein Keyless. Sie verweist an einen Schlüsseldienst oder ein
          Händlerhaus. Die geöffneten GM-Service-Seiten sagen, die Schlösser
          sollen schalten, wenn man den Entriegelungsschalter loslässt. Diese
          Aufteilung drucken sie nicht."
      - id: early-cycle
        title: Die Schlösser schalten, bevor der Schalter losgelassen wird
        text: "Dieselbe North-Coast-Seite sagt: Ein Schalten, bevor man die Entriegelung
          loslässt, heißt, der Truck ist nicht im Programmiermodus, und man
          fängt neu an. Wenn die Schlösser vor dem Loslassen weiter schalten,
          sagt die Seite, die Keyless-Anlage habe ein Problem und ein
          Schlüsseldienst oder Händler müsse die Sender programmieren. Die
          geöffneten GM-Seiten drucken diesen Frühschalt-Test nicht."
      - id: no-response
        title: Keine zweite Antwort vom Sender
        text: North Coast sagt, Lock und Unlock bis zu 30 Sekunden zusammen halten, bis
          die Schlösser wieder schalten. Die geöffneten GM-Seiten sagen, die
          Bestätigung komme nach etwa 15 Sekunden. Keine der Seiten gibt einen
          eigenen Test für einen Sender, der stumm bleibt, nachdem die Schlösser
          den Modus schon bestätigt haben. Dieser Fall ist hier unbekannt.
  fr:
    title: Programmation de la télécommande du Chevrolet Silverado 1500 2003-2006
    description: Étapes à bord de la télécommande keyless du Silverado 1500
      2003-2006, avec ID FCC LHJ011, références, pile et prix cités.
    summary: La télécommande keyless d’un Chevrolet Silverado 1500 2003-2006 se
      programme à l’allumage, sans valise. La feuille de la référence 21997127
      cite ce pick-up et imprime la séquence. La télécommande est séparée ; ce
      n’est pas la clé métallique de contact.
    scope: Silverado 1500 léger, de 2003 à 2006, marché des États-Unis. La même
      feuille cite aussi le Silverado 1500 2007 et plusieurs HD. Ils sont hors
      de cette page. Un pick-up sans keyless d’usine n’a pas de récepteur pour
      cette télécommande.
    diy:
      summary: Programmez dans la même séance chaque télécommande à conserver. La
        feuille dit que les émetteurs déjà en mémoire s’effacent quand le
        premier nouveau est accepté. Cette séquence ne programme que la
        télécommande keyless.
      condition: Il faut une télécommande compatible et la clé de contact qui tourne
        le barillet. Cela ne taille pas une clé métallique.
      safetyNote: La feuille dit que la première télécommande acceptée dans cette
        séance efface celles que le pick-up connaît déjà. Une mauvaise séquence
        peut effacer des télécommandes qui marchent ou ne jamais entrer en mode
        programmation. Si les portes ne se verrouillent pas puis ne se
        déverrouillent pas pour confirmer le mode, arrêtez. Un serrurier ou le
        concessionnaire peut finir le travail.
      notes:
        - text: L’en-tête de la feuille est la référence 21997127 et inclut le Chevrolet
            Silverado 1500 2003-2007 parmi les véhicules qui peuvent utiliser la
            séquence imprimée. Elle demande une valise pour Equinox 2005-2006,
            Torrent 2006 et Vue 2002-2003. Ces exceptions ne sont pas ce
            pick-up.
      steps:
        - text: Fermez toutes les portes.
        - text: Insérez la clé de contact dans le barillet d’allumage.
        - text: Maintenez l’interrupteur de déverrouillage de porte enfoncé.
        - text: Tout en tenant cet interrupteur en déverrouillage, tournez le contact sur
            ON, OFF, ON, OFF.
        - text: Relâchez l’interrupteur de déverrouillage. Les portes se verrouillent puis
            se déverrouillent une fois pour confirmer le mode programmation.
        - text: Sur une télécommande, maintenez Lock et Unlock ensemble jusqu’à ce que les
            portes se verrouillent et se déverrouillent à nouveau. La feuille
            d’instructions et les procédures d’atelier GM ouvertes ici disent
            que cette confirmation arrive après environ 15 secondes. La page de
            programmation de North Coast Keyless pour ce pick-up dit que le même
            appui peut prendre jusqu’à 30 secondes.
        - text: Répétez l’appui sur Lock et Unlock pour chaque télécommande à conserver,
            jusqu’à quatre, dans la même séance.
        - text: Tournez le contact sur RUN pour quitter le mode programmation, puis
            essayez verrouillage, déverrouillage et Panic sur chaque
            télécommande.
    variants:
