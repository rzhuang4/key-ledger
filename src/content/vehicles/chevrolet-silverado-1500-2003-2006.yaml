  zh-hans:
    title: 2003-2006 Chevrolet Silverado 1500 钥匙遥控器编程
    description: 2003-2006 Silverado 1500 免钥匙遥控器的车上步骤，含 FCC ID LHJ011、零件号、电池和有出处的价格。
    summary: 2003-2006 Chevrolet Silverado 1500 的免钥匙遥控器可以在点火开关处编程，不必用诊断仪。零件 21997127
      的说明书列出这辆货车并列出按键顺序。遥控器是分开的，不是金属点火钥匙。
    scope: 轻型 Silverado 1500，2003 至 2006，美国市场。同一份说明书也列出 2007 Silverado 1500 和几款
      HD。那些车不在本页。出厂没有免钥匙系统的货车，没有接收器可让这只遥控器对上。
    diy:
      summary: 要保留的每只遥控器都要在同一次里编程。说明书说，第一只新遥控器被接受时，先前存着的发射器会被清除。这个顺序只编程免钥匙遥控器。
      condition: 需要一只相容的遥控器，以及能转动锁芯的点火钥匙。这不会切削金属钥匙。
      safetyNote: 说明书说，这一次里第一只被接受的遥控器会清除货车已经认得的遥控器。顺序错了可能清掉还能用的遥控器，或根本进不了编程模式。如果车门没有上锁再开锁来确认编程模式，就停下来。锁匠或经销商可以把工作做完。
      notes:
        - text: 说明书自己的标题是零件号 21997127，并列出 2003-2007 Chevrolet Silverado 1500 可以使用印出的顺序。它要
            2005-2006 Equinox、2006 Torrent 和 2002-2003 Vue 的车主改用诊断仪。那些例外不是这辆货车。
      steps:
        - text: 关上所有车门。
        - text: 把点火钥匙插入点火锁芯。
        - text: 按住车门开锁开关。
        - text: 按住该开关在开锁位置时，把点火开关依次转到 ON、OFF、ON、OFF。
        - text: 放开开锁开关。车门会上锁再开锁一次，表示货车已进入编程模式。
        - text: 在一只遥控器上同时按住 Lock 和 Unlock，直到车门再上锁再开锁。说明书和这里打开的 GM 维修程序都说，这个确认大约在 15
            秒后出现。North Coast Keyless 给这辆货车的编程页说，同样的按住可能要到 30 秒。
        - text: 对每一只要保留的遥控器重复按住 Lock 和 Unlock，同一次最多四只。
        - text: 把点火开关转到 RUN 以离开编程模式，然后测试每只遥控器的上锁、开锁和 Panic。
    variants:
