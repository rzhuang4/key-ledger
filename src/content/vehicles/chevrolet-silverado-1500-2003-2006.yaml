  ignitionKeyInCylinder: required
ignitionKey:
  status: verified
  blade: B102
  transponder: none
  note: Keysolved's 1999-2007 Silverado 1500 page lists the ignition key as a
    plain steel B102 with no chip, and the system as GM Passlock in the body
    control module rather than a transponder in the key. It says that covers all
    1999-2006 trucks and the 2007 Classic. The same page lists a separate
    3-button keyless remote, FCC LHJ011, for 2003-2006 and the 2007 Classic.
    This does not add steps for cutting that blade.
  sourceIds:
