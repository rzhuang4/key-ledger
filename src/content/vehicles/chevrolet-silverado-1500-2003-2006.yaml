i18n:
  zh-hant:
    title: 2003-2006 Chevrolet Silverado 1500 鑰匙遙控器編程
    description: 2003-2006 Silverado 1500 免鑰匙遙控器的車上步驟，含 FCC ID LHJ011、零件號、電池與有出處的價格。
    summary: 2003-2006 Chevrolet Silverado 1500 的免鑰匙遙控器可以在點火開關處編程，不必用診斷機。零件 21997127
      的說明書列出這輛貨車並列出按鍵順序。遙控器是分開的，不是金屬點火鑰匙。
    scope: 輕型 Silverado 1500，2003 至 2006，美國市場。同一份說明書也列出 2007 Silverado 1500 和幾款
      HD。那些車不在本頁。出廠沒有免鑰匙系統的貨車，沒有接收器可讓這只遙控器對上。
    diy:
      summary: 要保留的每只遙控器都要在同一次裡編程。說明書說，第一只新遙控器被接受時，先前存著的發射器會被清除。這個順序只編程免鑰匙遙控器。
      condition: 需要一只相容的遙控器，以及能轉動鎖芯的點火鑰匙。這不會切削金屬鑰匙。
      safetyNote: 說明書說，這一次裡第一只被接受的遙控器會清除貨車已經認得的遙控器。順序錯了可能清掉還能用的遙控器，或根本進不了編程模式。如果車門沒有上鎖再開鎖來確認編程模式，就停下來。鎖匠或經銷商可以把工作做完。
      notes:
        - text: 說明書自己的標題是零件號 21997127，並列出 2003-2007 Chevrolet Silverado 1500 可以使用印出的順序。它要
            2005-2006 Equinox、2006 Torrent 和 2002-2003 Vue 的車主改用診斷機。那些例外不是這輛貨車。
      steps:
        - text: 關上所有車門。
        - text: 把點火鑰匙插入點火鎖芯。
        - text: 按住車門開鎖開關。
        - text: 按住該開關在開鎖位置時，把點火開關依序轉到 ON、OFF、ON、OFF。
        - text: 放開開鎖開關。車門會上鎖再開鎖一次，表示貨車已進入編程模式。
        - text: 在一只遙控器上同時按住 Lock 和 Unlock，直到車門再上鎖再開鎖。說明書和這裡打開的 GM 維修程序都說，這個確認大約在 15
            秒後出現。North Coast Keyless 給這輛貨車的編程頁說，同樣的按住可能要到 30 秒。
        - text: 對每一只要保留的遙控器重複按住 Lock 和 Unlock，同一次最多四只。
        - text: 把點火開關轉到 RUN 以離開編程模式，然後測試每只遙控器的上鎖、開鎖和 Panic。
    variants:
      - id: lhj011-3-button
        name: 3 鍵免鑰匙遙控器
        years: 2003-2006
        keyTypeNote: 步驟進行時，點火鑰匙留在鎖芯裡，你按的是另一只發射器上的按鈕。Car and Truck Remotes
          把對應商品賣成轉鑰匙點火貨車用的免鑰匙遙控器，按鈕是 Lock、Unlock 和 Panic。它不是摺疊鑰匙，也不是近接遙控器。
