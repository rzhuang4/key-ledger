  fr:
    title: Programmation et références de la Honda CR-V 2012-2016
    description: Les clés antidémarrage de la Honda CR-V 2012-2016 exigent un outil
      de diagnostic. ID FCC, références, piles et prix vendeurs, chacun avec une
      source.
    summary: Les pages d’atelier Honda pour le CR-V 2012-2016 disent que le système
      de diagnostic Honda (HDS) est requis pour enregistrer une clé
      antidémarrage, et que le même travail programme l’émetteur keyless. Cette
      page ne donne pas de séquence de boutons à bord. Les fiches montrent deux
      clés à télécommande différentes, et les vendeurs ne s’accordent pas sur
      une seule référence pour 2012-2013.
    scope: CR-V de quatrième génération, années 2012 à 2016, marché des États-Unis,
      clés à télécommande avec panneton. Les vendeurs ci-dessous excluent les
      clés intelligentes à bouton, et cette page ne leur donne pas d’ID FCC
      propre. Une clé de 2012 et une de 2015 ne sont pas traitées comme la même
      pièce.
    diy:
      summary: Une procédure d’atelier du CR-V LX 2012 et une réimpression d’atelier
        du CR-V 2012-2016 disent que le HDS est requis pour enregistrer des clés
        antidémarrage. Programmer l’antidémarrage programme aussi l’émetteur
        keyless. Le boîtier mémorise jusqu’à six clés. Dans le texte du LX 2012,
        ajouter une clé exige une clé déjà enregistrée et le premier mot de
        passe du système iN de Honda. Si toutes les clés sont perdues, ce texte
        demande le code PCM de l’antidémarrage. Ce sont des étapes d’atelier.
        Elles ne sont pas réimprimées ici comme quelque chose à essayer dans
        l’allée.
      condition: Tom's Key vend un programmateur séparé et dit qu’il faut au moins une
        clé qui marche pour l’utiliser. Cela reste un outil, pas une
        programmation à bord. Car Keys Express dit que le panneton doit être
        taillé.
      safetyNote: Il n’y a pas de séquence à bord sur cette page. Deviner des cycles
        de contact ou des combinaisons de boutons peut laisser une clé non
        reconnue, et un serrurier ou un concessionnaire Honda devra alors la
        récupérer avec le bon outil. Arrêtez si vous n’avez pas cet outil ni le
        mot de passe ou le code antidémarrage que la procédure utilise.
    variants:
      - id: remote-head-2012-2013
        name: Clé à télécommande à 3 boutons
        years: Indiquée par des vendeurs pour 2012-2013, et par certains pour 2007-2013
        keyTypeNote: "Car Keys Express appelle cela un combo télécommande et clé, aussi
          clé à tête télécommande : une clé de contact à transpondeur plus Lock,
          Unlock et Panic. Tom's Key vend le même type de clé à 3 boutons et dit
          qu’elle ne va pas sur un démarrage à bouton."
        fccNotes:
          - "Autorisation FCC de Honda Lock Mfg. Co., Ltd., modèle HLIK-1T,
            émetteur keyless. Date : 9 mai 2006. La fréquence de l’autorisation
            est 313,85 MHz. Car Keys Express, Tom's Key et MK3 impriment
            MLBHLIK-1T sur des fiches de clé à télécommande de CR-V."
        partNotes:
          - MK3 l’indique comme référence OEM de la télécommande CR-V 2012-2013.
            Les vendeurs américains vus plus bas impriment d’autres numéros. Non
            confirmé sur une fiche pièces Honda.
          - Tom's Key l’indique comme la référence que sa clé d’après-vente à 3
            boutons remplace. La fiche couvre aussi d’autres Honda, pas
            seulement le CR-V.
          - Car Keys Express indique HLIK-1T comme référence. Cette chaîne est
            aussi le modèle FCC. Traitez-la comme une étiquette du vendeur, pas
            comme la preuve que c’est le numéro du comptoir pièces Honda.
          - Numéro Strattec imprimé par Car Keys Express.
        batteryNote: MK3 indique CR1616. L’autorisation FCC ne nomme pas la pile. Les
          pages Tom's Key et Car Keys Express vues pour cette clé ne listent pas
          de pile.
        frequencyNote: C’est la fréquence de l’autorisation. La page MK3 dit 315 MHz
          pour le même ID FCC. Utilisez le chiffre de l’autorisation et faites
