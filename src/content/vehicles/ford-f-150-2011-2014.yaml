# 2011–2014 Ford F-150 remote-head key. Copy this file to add a page. Rules: README.md.
make: Ford
makeSlug: ford
model: F-150
modelSlug: f-150
yearStart: 2011
yearEnd: 2014
yearSlug: "2011-2014"
market: US
title: "2011-2014 Ford F-150 remote-head key programming"
description: "Two-key programming notes for a 2011-2014 F-150 remote-head key,
  FCC ID CWTWB1U793, part numbers, and where the sources disagree."
summary: "A 2013 F-150 owner's guide says you can program your own integrated
  keyhead transmitter if you already have two programmed keys. Ford's current
  how-to page describes the same kind of key and uses different hold times. A
  parts seller for the 2013 truck says on-board programming is not available.
  Those disagreements are spelled out below."
scope: "2011-2014 Ford F-150 trucks that use a bladed integrated keyhead
  transmitter, often sold as a 3-button remote-head key with FCC ID CWTWB1U793.
  The step timings below are from a transcription of the 2013 owner's guide, not
  from the 2011, 2012, or 2014 books. Push-button Intelligent Access keys are
  not covered."
reviewed: "2026-11-19"
diy:
  status: "yes"
  summary: "On-board programming is published for an integrated keyhead
    transmitter when two coded keys already work. Without those two keys, both
    the 2013 guide transcription and Ford's how-to page send you to a dealer."
  condition: "You need two previously programmed coded keys and one new
    unprogrammed integrated keyhead transmitter or SecuriLock key. The blade
    still has to be cut. Car and Truck Remotes says they do not cut or program
    the remote they sell."
  safetyNote: "Hold times do not match across the sources on this page. A wrong
    sequence can leave the new key unprogrammed. If you do not already have two
    working keys, the on-board method does not apply and you need a dealer or a
    locksmith. If one careful attempt fails, stop and have a locksmith or dealer
    finish the job."
  sourceIds:
    - owner-2013
    - ford-howto
  notes:
    - text: "The 2013 transcription says the procedure programs both the engine
        immobilizer code and the remote buttons, and that it works only with
        integrated keyhead transmitters or standard SecuriLock keys. It allows a
        maximum of eight coded keys, and only four of those eight can be
        integrated keyhead transmitters."
      sourceIds:
        - owner-2013
    - text: "Car and Truck Remotes' 2013 F-150 listing says 'On Board Programming: No'
        and that the remote must be professionally cut and programmed by a
        locksmith. That contradicts the owner's guide transcription and Ford's
        how-to. The seller also says a dealer may refuse to program an
        aftermarket remote."
      sourceIds:
        - ctr-2013
  steps:
    - text: "Have two previously programmed coded keys and the new unprogrammed key
        within reach. Read the whole sequence before you start. These wordings
        follow the 2013 F-150 Owner's Guide, 1st Printing, as transcribed by
        Auto Guide Galaxy. This site did not open Ford's original PDF."
      sourceIds:
        - owner-2013
    - text: "Insert the first programmed key. Turn the ignition from off to on and
        leave it on for at least 3 seconds and not more than 10. Turn it off and
        remove the key."
      sourceIds:
        - owner-2013
    - text: "After 3 seconds, but within 10 seconds of removing the first key, insert
        the second programmed key. Turn the ignition on for at least 1 second
        and not more than 10. Turn it off and remove the key."
      sourceIds:
        - owner-2013
    - text: "After 3 seconds, but within 10 seconds of removing the second key, insert
        the new unprogrammed key. Turn the ignition on for at least 1 second and
        not more than 10, then remove the key."
      sourceIds:
        - owner-2013
    - text: "If programming worked, the new key starts the engine. If it is an
        integrated keyhead transmitter, it also operates remote entry. If it
        failed, the transcription says to wait 20 seconds and repeat, then take
        the truck to an authorized dealer."
      sourceIds:
        - owner-2013
