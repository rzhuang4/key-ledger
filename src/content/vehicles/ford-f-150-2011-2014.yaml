            - Après 3 secondes, mais dans les 10 secondes après avoir retiré la
              première clé
            - Après 3 secondes, mais dans les 10 secondes après avoir mis le
              contact sur off
        - action: Deuxième clé programmée sur on
          values:
            - Au moins 1 seconde, pas plus de 10
            - Au moins 3 secondes, pas plus de 10
        - action: Attente avant la nouvelle clé
          values:
            - Après 3 secondes, mais dans les 10 secondes après avoir retiré la
              deuxième clé
            - Après 3 secondes, mais dans les 20 secondes après avoir coupé le
              contact et retiré la deuxième clé
        - action: Nouvelle clé sur on
          values:
            - Au moins 1 seconde, pas plus de 10
            - Au moins 6 secondes
