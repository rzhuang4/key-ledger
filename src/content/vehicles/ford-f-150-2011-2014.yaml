  de:
    title: Programmierung des Fernbedienungsschlüssels Ford F-150 2011-2014
    description: Notizen zur Zwei-Schlüssel-Programmierung des
      Fernbedienungsschlüssels F-150 2011-2014, FCC-ID CWTWB1U793, Teilenummern
      und wo die Quellen widersprechen.
    summary: Die Betriebsanleitung des F-150 2013 sagt, Sie können einen
      integrierten Schlüsselkopf-Sender selbst programmieren, wenn Sie schon
      zwei programmierte Schlüssel haben. Fords aktuelle Anleitung beschreibt
      denselben Schlüsseltyp mit anderen Haltezeiten. Ein Teilehändler für den
      Truck 2013 sagt, es gebe keine Programmierung im Fahrzeug. Die
      Widersprüche stehen unten.
    scope: Ford F-150 2011-2014 mit integriertem Schlüsselkopf-Sender und Bart, oft
      als 3-Tasten-Fernbedienungsschlüssel mit FCC-ID CWTWB1U793 verkauft. Die
      Zeiten unten stammen aus einer Abschrift der Anleitung 2013, nicht aus den
      Büchern 2011, 2012 oder 2014. Intelligent-Access-Taster sind nicht
      enthalten.
    diy:
      summary: Für einen integrierten Schlüsselkopf-Sender ist eine Programmierung im
        Fahrzeug veröffentlicht, wenn zwei codierte Schlüssel schon
        funktionieren. Ohne diese beiden schicken die Abschrift von 2013 und
        Fords Seite Sie zum Händler.
      condition: Sie brauchen zwei bereits programmierte codierte Schlüssel und einen
        neuen, noch nicht programmierten integrierten Schlüsselkopf-Sender oder
        SecuriLock-Schlüssel. Der Bart muss trotzdem geschnitten werden. Car and
        Truck Remotes sagt, sie schneiden und programmieren den verkauften
        Sender nicht.
      safetyNote: Die Haltezeiten der Quellen auf dieser Seite stimmen nicht überein.
        Eine falsche Reihenfolge kann den neuen Schlüssel unprogrammiert lassen.
        Ohne zwei funktionierende Schlüssel gilt die Methode im Fahrzeug nicht;
        Sie brauchen einen Händler oder einen Schlüsseldienst. Scheitert ein
        vorsichtiger Versuch, hören Sie auf und lassen Sie Schlüsseldienst oder
        Händler fertigmachen.
      notes:
        - text: Die Abschrift von 2013 sagt, das Verfahren programmiere den
            Wegfahrsperrencode und die Fernbedienungstasten und gelte nur für
            integrierte Schlüsselkopf-Sender oder normale SecuriLock-Schlüssel.
            Höchstens acht codierte Schlüssel, und nur vier davon dürfen
            integrierte Schlüsselkopf-Sender sein.
        - text: "Das Angebot von Car and Truck Remotes für den F-150 2013 sagt „On Board
            Programming: No“ und dass ein Schlüsseldienst den Sender fachgerecht
            schneiden und programmieren muss. Das widerspricht der
            Anleitungsabschrift und Fords Seite. Der Händler sagt auch, ein
            Vertragshändler könne einen Nachrüstsender ablehnen."
      steps:
        - text: Halten Sie zwei bereits programmierte codierte Schlüssel und den neuen,
            noch nicht programmierten Schlüssel griffbereit. Lesen Sie die ganze
            Folge, bevor Sie anfangen. Der Wortlaut folgt der Owner's Guide des
            F-150 2013, 1. Druck, abgeschrieben von Auto Guide Galaxy. Diese
            Website hat Fords Original-PDF nicht geöffnet.
        - text: Stecken Sie den ersten programmierten Schlüssel ein. Drehen Sie die
            Zündung von off auf on und lassen Sie sie mindestens 3 und höchstens
            10 Sekunden an. Drehen Sie auf off und ziehen Sie den Schlüssel.
        - text: Nach 3 Sekunden, aber innerhalb von 10 Sekunden nach dem Ziehen des ersten
            Schlüssels, stecken Sie den zweiten programmierten Schlüssel ein.
            Zündung mindestens 1 und höchstens 10 Sekunden auf on, dann off und
            ziehen.
        - text: Nach 3 Sekunden, aber innerhalb von 10 Sekunden nach dem Ziehen des
            zweiten Schlüssels, stecken Sie den neuen unprogrammierten Schlüssel
            ein. Zündung mindestens 1 und höchstens 10 Sekunden auf on, dann
            ziehen.
        - text: "Wenn es geklappt hat, startet der neue Schlüssel den Motor. Ist es ein
            integrierter Schlüsselkopf-Sender, bedient er auch die
            Fernentriegelung. Bei Misserfolg sagt die Abschrift: 20 Sekunden
            warten und wiederholen, dann den Truck zum Vertragshändler bringen."
    comparisons:
      caption: Mischen Sie diese Haltezeiten nicht in einem Versuch. Die linke Spalte
        ist die Abschrift der Anleitung 2013. Die rechte ist Fords aktuelle
        allgemeine Anleitung und nennt den F-150 nicht.
      columns:
        - heading: Abschrift der Anleitung 2013
        - heading: Ford.com-Anleitung (kein Modelljahr)
      rows:
        - action: Erster programmierter Schlüssel auf on
          values:
            - Mindestens 3 Sekunden, höchstens 10
            - Mindestens 3 Sekunden, höchstens 10
        - action: Warten vor dem zweiten Schlüssel
          values:
            - Nach 3 Sekunden, aber innerhalb von 10 Sekunden nach dem Ziehen
              des ersten Schlüssels
            - Nach 3 Sekunden, aber innerhalb von 10 Sekunden nach dem Drehen
              der Zündung auf off
        - action: Zweiter programmierter Schlüssel auf on
          values:
            - Mindestens 1 Sekunde, höchstens 10
            - Mindestens 3 Sekunden, höchstens 10
        - action: Warten vor dem neuen Schlüssel
          values:
            - Nach 3 Sekunden, aber innerhalb von 10 Sekunden nach dem Ziehen
              des zweiten Schlüssels
            - Nach 3 Sekunden, aber innerhalb von 20 Sekunden nach dem
              Ausschalten und Ziehen des zweiten Schlüssels
        - action: Neuer Schlüssel auf on
          values:
            - Mindestens 1 Sekunde, höchstens 10
            - Mindestens 6 Sekunden
