    unverified:
      - Le PDF original du guide du propriétaire Ford 2013 n’a pas été
        téléchargé. Les durées viennent d’une transcription tierce qui se
        présente comme l’Owner's Guide du F-150 2013, 1er tirage États-Unis. Le
        guide Ford.com utilise d’autres durées et ne nomme pas ce pick-up.
      - Les guides 2011, 2012 et 2014 n’ont pas été ouverts, donc les durées de
        2013 ne sont pas confirmées pour ces années.
      - Une clé de démarrage à distance à 4 boutons, et toute télécommande
        Intelligent Access ou à bouton, de ces années.
      - Une autorisation FCC de l’ID OUC6000022 indiqué par le vendeur.
      - Prix posés de concession et de serrurier.
      - La chimie de la pile et l’affirmation de puce 4D63 dans un document
        Ford. Les deux viennent de la fiche pièces, et la puce n’est pas dans
        l’autorisation FCC.
